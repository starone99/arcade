<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="짐을 돌려 맞춰 이삿짐 상자를 빈틈없이 채우는 3D 퍼즐">
<style>[hidden]{display:none!important}</style>
<title>카피바라 이삿짐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: full-screen room with the moving box in the middle; HUD on top, a bottom dock with the tray of belongings
   and the turn / place buttons; side buttons for view, undo, hint. One deliberate light look: a sunny moving day. */
:root {
  --sky-top: #f3e6d4;
  --sky-bot: #fbf4ea;
  --ink: #3a3631;
  --ink-soft: #7a7066;
  --panel: #fffdf8;
  --panel-line: #e8dccb;
  --kraft: #c99a62;
  --kraft-deep: #a5773f;
  --go: #6cba86;
  --go-deep: #4e9a68;
  --blush: #ff9fb2;
  --locked: #d8d0c4;
  --warn: #e3584b;
  --f-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; overflow: hidden; background: linear-gradient(180deg, var(--sky-top), var(--sky-bot)); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--kraft); outline-offset: 2px; }
#app { position: relative; height: 100%; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.round { width: 44px; height: 44px; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--panel); box-shadow: 0 3px 0 var(--panel-line), 0 8px 18px rgba(58, 54, 49, .12); }
.round svg { width: 21px; height: 21px; stroke: var(--ink); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.round:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--panel-line); }
.round:disabled { opacity: .45; cursor: default; }
.coach { animation: beat 1s ease-in-out infinite; box-shadow: 0 0 0 3px var(--kraft), 0 8px 18px rgba(58, 54, 49, .2) !important; }
@keyframes beat { 50% { transform: scale(1.07); } }

.hud { position: absolute; left: 0; right: 0; top: 0; display: grid; grid-template-columns: auto 1fr auto; align-items: start; gap: 10px; padding: max(12px, env(safe-area-inset-top, 0px)) 16px 0; pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud-right { display: flex; gap: 8px; }
.stage-name { justify-self: center; text-align: center; min-width: 0; }
.stage-name b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 22px; line-height: 1.2; text-wrap: balance; }
.stage-name > span { display: inline-block; margin-top: 4px; padding: 2px 12px; border-radius: 999px; background: rgba(255, 253, 248, .8); font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.goals { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 6px; margin-top: 6px; }
.goal { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px 2px 8px; border-radius: 999px; background: rgba(255, 253, 248, .9); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.goal i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.goal.done { background: var(--go); color: #fff; }

.side { position: absolute; display: grid; gap: 8px; bottom: calc(var(--dock-h, 170px) + 12px); }
.side.left { left: 16px; }
.side.right { right: 16px; }
.side .label { display: block; font-size: 11px; color: var(--ink-soft); text-align: center; margin-top: 2px; }

.dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 12px max(12px, env(safe-area-inset-bottom, 0px)); background: rgba(255, 253, 248, .92); border-top: 1px solid var(--panel-line); box-shadow: 0 -10px 30px rgba(58, 54, 49, .08); }
.tray { display: flex; gap: 8px; overflow-x: auto; padding: 4px 4px 8px; scroll-snap-type: x proximity; }
.item { flex: none; width: 72px; height: 72px; border-radius: 16px; border: 2px solid var(--panel-line); background: #fff; display: block; padding: 5px; scroll-snap-align: center; position: relative; }
.item svg { display: block; width: 100%; height: 100%; }
.item[aria-pressed="true"] { border-color: var(--kraft); background: #fff6ea; box-shadow: 0 0 0 3px rgba(201, 154, 98, .3); }
.item .tag { position: absolute; top: -6px; right: -6px; font-size: 10px; padding: 0 6px; border-radius: 999px; background: var(--ink); color: #fff; font-family: var(--f-display); }
.actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.pill { height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--panel-line); background: #fff; display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-display); font-size: 15px; }
.pill svg { width: 18px; height: 18px; stroke: var(--ink); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.pill:disabled { opacity: .45; cursor: default; }
.pill.place { background: var(--go); border-color: var(--go); color: #fff; padding: 0 22px; box-shadow: 0 4px 0 var(--go-deep); }
.pill.place svg { stroke: #fff; }
.pill.place:disabled { background: var(--locked); border-color: var(--locked); box-shadow: none; }
.dock-note { text-align: center; font-size: 13px; color: var(--ink-soft); margin: 0 0 6px; min-height: 1.5em; }
.dock-note.warn { color: #5b4fd6; }

.tip { position: absolute; left: 50%; transform: translateX(-50%); top: calc(max(12px, env(safe-area-inset-top, 0px)) + 104px); width: min(420px, calc(100% - 32px)); display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 18px; background: var(--panel); border: 0; box-shadow: 0 8px 22px rgba(58, 54, 49, .14); text-align: left; font-size: 14px; }
.tip svg { width: 40px; height: 30px; }
.toast { position: absolute; left: 50%; bottom: calc(var(--dock-h, 170px) + 16px); transform: translateX(-50%); max-width: calc(100% - 140px); padding: 8px 16px; border-radius: 999px; background: var(--ink); color: var(--panel); font-size: 14px; text-align: center; box-shadow: 0 8px 20px rgba(58, 54, 49, .25); animation: pop .25s ease-out; }
@keyframes pop { from { opacity: 0; transform: translate(-50%, 6px); } to { opacity: 1; transform: translate(-50%, 0); } }

.overlay { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr); place-items: end center; overflow: auto; padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px)); }
.overlay.center { place-items: center; background: rgba(243, 230, 212, .6); }
.card { width: min(460px, 100%); min-width: 0; background: var(--panel); border-radius: 26px; padding: 22px 22px 20px; box-shadow: 0 6px 0 var(--panel-line), 0 20px 50px rgba(58, 54, 49, .18); }
.title-card { text-align: center; }
.title-card h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(32px, 9vw, 44px); line-height: 1.1; text-wrap: balance; }
.title-card h1 em { font-style: normal; color: var(--kraft-deep); }
.title-card p { margin: 8px auto 18px; color: var(--ink-soft); max-width: 30em; text-wrap: balance; }
.btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.primary { border: 0; border-radius: 18px; padding: 12px 22px; min-width: 140px; background: var(--kraft); color: #fff; font-family: var(--f-display); font-size: 19px; box-shadow: 0 4px 0 var(--kraft-deep); }
.primary:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--kraft-deep); }
.secondary { border: 2px solid var(--panel-line); border-radius: 18px; padding: 10px 20px; min-width: 120px; background: var(--panel); font-family: var(--f-display); font-size: 18px; }
.progress-note { margin-top: 14px; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.select-card { width: min(560px, 100%); }
.select-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.select-head h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 26px; }
.chapters { position: relative; display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 10px; margin: 0 -4px 6px; }
.chapters button { flex: none; display: grid; grid-template-columns: auto auto; column-gap: 6px; align-items: baseline; text-align: left; border: 2px solid var(--panel-line); border-radius: 14px; background: #fff; padding: 6px 12px 5px; }
.chapters button b { font-family: var(--f-display); font-weight: 400; font-size: 18px; color: var(--kraft-deep); grid-row: span 2; }
.chapters button span { font-size: 13px; white-space: nowrap; }
.chapters button small { font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.chapters button[aria-selected="true"] { border-color: var(--kraft); background: #fff6ea; }
.chapters button:disabled { cursor: not-allowed; opacity: .5; }
.village-gim { margin: -2px 0 10px; font-size: 13px; color: var(--ink-soft); }
.stages { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.stage { border: 2px solid var(--panel-line); border-radius: 18px; background: #fff; padding: 10px 6px 9px; text-align: center; display: grid; gap: 2px; justify-items: center; }
.stage .num { font-family: var(--f-display); font-size: 26px; line-height: 1; color: var(--kraft-deep); }
.stage .nm { font-size: 12px; line-height: 1.3; min-height: 1.3em; }
.stage.cleared { border-color: var(--go); }
.stage.next { border-color: var(--kraft); box-shadow: 0 0 0 3px rgba(201, 154, 98, .3); }
.stage:disabled { cursor: not-allowed; background: #f6f2ec; }
.stage:disabled .num, .stage:disabled .nm { color: var(--locked); }
.flowers { display: flex; gap: 2px; height: 16px; align-items: center; }
.flowers svg { width: 15px; height: 15px; }
.f-on { fill: var(--blush); } .f-off { fill: var(--locked); }
.intro-card { text-align: center; width: min(380px, 100%); }
.intro-tag { display: inline-block; padding: 2px 12px; border-radius: 999px; background: var(--kraft); color: #fff; font-family: var(--f-display); font-size: 14px; }
.gim-art { display: block; width: 112px; height: 112px; margin: 12px auto 6px; }
.intro-card h2 { margin: 0 0 6px; font-family: var(--f-display); font-weight: 400; font-size: 26px; }
.intro-card p { margin: 0 auto 18px; color: var(--ink-soft); max-width: 26em; text-wrap: pretty; }
.dex-list { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); max-height: min(62vh, 560px); overflow: auto; padding: 2px; }
.dex-item { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; align-items: center; text-align: left; background: #fff; border: 2px solid var(--panel-line); border-radius: 16px; padding: 8px 10px; }
.dex-item svg { width: 52px; height: 52px; }
.dex-item b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 16px; }
.dex-item small { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 12px; color: var(--ink-soft); line-height: 1.4; }
.dex-item.locked { cursor: default; background: #f6f2ec; }
#clear { background: linear-gradient(180deg, transparent 40%, rgba(251, 244, 234, .7)); }
.clear-card { text-align: center; animation: rise .45s cubic-bezier(.2, .9, .3, 1.2); }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.clear-card h2 { margin: 0 0 4px; font-family: var(--f-display); font-weight: 400; font-size: 28px; text-wrap: balance; }
.big-flowers { display: flex; justify-content: center; gap: 8px; margin: 10px 0 6px; }
.big-flowers svg { width: 44px; height: 44px; }
.big-flowers svg.f-on-anim { animation: bloom .5s ease-out both; }
@keyframes bloom { from { transform: scale(.2) rotate(-40deg); } to { transform: none; } }
.stats { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 6px 0 16px; }
.stats span { padding: 4px 12px; border-radius: 999px; background: #f3ede3; font-size: 14px; font-variant-numeric: tabular-nums; }
.clear-next { margin: -6px 0 14px; font-size: 14px; color: var(--kraft-deep); text-wrap: balance; }
@media (max-width: 480px) {
  .hud { padding-inline: 12px; gap: 6px; }
  .hud-right { flex-direction: column; gap: 6px; }
  .round { width: 40px; height: 40px; }
  .stage-name b { font-size: 18px; }
  .goal { font-size: 12px; }
  .side.left { left: 10px; } .side.right { right: 10px; }
  .item { width: 64px; height: 64px; }
  .pill { padding: 0 11px; font-size: 14px; }
  .pill.place { padding: 0 16px; }
  .card { padding: 18px 16px 16px; border-radius: 22px; }
  .stages { gap: 8px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="flower" viewBox="0 0 20 20">
    <circle cx="10" cy="4.6" r="3.9"/><circle cx="15.1" cy="8.3" r="3.9"/><circle cx="13.2" cy="14.3" r="3.9"/>
    <circle cx="6.8" cy="14.3" r="3.9"/><circle cx="4.9" cy="8.3" r="3.9"/><circle cx="10" cy="10" r="3" fill="#fff6d8"/>
  </symbol>
  <symbol id="capy" viewBox="0 0 40 30">
    <rect x="11" y="11" width="27" height="16" rx="8" fill="#b07a4f"/><rect x="2" y="8" width="20" height="17" rx="7" fill="#b07a4f"/>
    <rect x="1" y="15" width="11" height="10" rx="4.5" fill="#7a5233"/><circle cx="12" cy="6" r="5" fill="#ffa236"/>
    <path d="M13 14 q2.4 -2 4.8 0" stroke="#3a3631" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </symbol>
</svg>

<div id="app">
  <canvas id="scene" aria-label="이삿짐 상자. 짐을 골라 상자 위를 눌러 자리를 정하고 넣기를 눌러요."></canvas>

  <header class="hud" id="hud" hidden>
    <button type="button" class="round" id="toSelect" aria-label="스테이지 목록"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h14"/></svg></button>
    <div class="stage-name"><b id="stageTitle"></b><span id="moveLabel"></span><div class="goals" id="goals" aria-live="polite"></div></div>
    <div class="hud-right">
      <button type="button" class="round" id="helpBtn" aria-label="짐싸기 도감"><svg viewBox="0 0 24 24"><path d="M9.2 9a3 3 0 1 1 4.3 2.7c-.9.5-1.5 1.2-1.5 2.3v.5"/><path d="M12 18h.01"/></svg></button>
      <button type="button" class="round" id="soundBtn" aria-label="소리 끄기"><svg viewBox="0 0 24 24" id="soundIcon"></svg></button>
    </div>

  <button type="button" class="tip" id="tip" hidden><svg viewBox="0 0 40 30" aria-hidden="true"><use href="#capy"/></svg><span id="tipText"></span></button>
  <div class="toast" id="toast" role="status" hidden></div>

  <div class="side left" id="sideL" hidden>
    <div><button type="button" class="round" id="viewL" aria-label="상자를 왼쪽으로 돌려 보기"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg></button><span class="label">보기</span></div>
    <div><button type="button" class="round" id="viewR" aria-label="상자를 오른쪽으로 돌려 보기"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4h-4"/></svg></button><span class="label">보기</span></div>
  </div>
  <div class="side right" id="sideR" hidden>
    <div><button type="button" class="round" id="undoBtn" aria-label="한 번 되돌리기"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button><span class="label">되돌리기</span></div>
    <div><button type="button" class="round" id="hintBtn" aria-label="힌트"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z"/></svg></button><span class="label">힌트</span></div>
    <div><button type="button" class="round" id="resetBtn" aria-label="처음부터"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button><span class="label">처음부터</span></div>
  </div>

  <section class="dock" id="dock" hidden>

      <button type="button" class="pill" data-turn="pitch"><svg viewBox="0 0 24 24"><path d="M12 4v16M7 9l5-5 5 5"/></svg>세우기</button>
      <button type="button" class="pill" data-turn="roll"><svg viewBox="0 0 24 24"><path d="M4 12h16M9 7l-5 5 5 5"/></svg>눕히기</button>
      <button type="button" class="pill place" id="placeBtn"><svg viewBox="0 0 24 24"><path d="M12 4v13M6 11l6 6 6-6"/></svg>넣기</button>
    </div>
  </section>

  <section class="overlay" id="title">
    <div class="card title-card">
      <h1>카피바라 <em>이삿짐</em></h1>
      <p>이사 가는 날이에요. 짐을 하나씩 골라 상자에 빈틈없이 채우면 카피바라가 테이프를 붙여요.</p>
      <div class="btn-row">
        <button type="button" class="primary" id="playBtn">시작하기</button>
        <button type="button" class="secondary" id="stagesBtn">스테이지</button>
      </div>
      <div class="progress-note" id="progressNote"></div>
    </div>
  </section>

  <section class="overlay center" id="select" hidden>
    <div class="card select-card" role="dialog" aria-labelledby="selectTitle">
      <div class="select-head">
        <h2 id="selectTitle">방 고르기</h2>
        <button type="button" class="round" id="closeSelect" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="chapters" id="chapters" role="tablist" aria-label="방"></div>
      <p class="village-gim" id="villageGim"></p>
      <div class="stages" id="stages"></div>
      <div class="progress-note" id="selectNote"></div>
    </div>
  </section>

  <section class="overlay center" id="intro" hidden>
    <div class="card intro-card" role="dialog" aria-labelledby="introTitle">
      <span class="intro-tag" id="introTag"></span>
      <svg class="gim-art" id="introArt" viewBox="0 0 64 64" aria-hidden="true"></svg>
      <h2 id="introTitle"></h2>
      <p id="introText"></p>
      <button type="button" class="primary" id="introGo">해볼게요</button>
    </div>
  </section>

  <section class="overlay center" id="dex" hidden>
    <div class="card select-card" role="dialog" aria-labelledby="dexTitle">
      <div class="select-head">
        <h2 id="dexTitle">짐싸기 도감</h2>
        <button type="button" class="round" id="closeDex" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="dex-list" id="dexList"></div>
    </div>
  </section>

  <section class="overlay" id="clear" hidden>
    <div class="card clear-card" role="dialog" aria-labelledby="clearTitle">
      <h2 id="clearTitle"></h2>
      <div class="big-flowers" id="bigFlowers"></div>
      <div class="stats" id="clearStats"></div>
      <p class="clear-next" id="clearNext" hidden></p>
      <div class="btn-row">
        <button type="button" class="secondary" id="againBtn">다시 하기</button>
        <button type="button" class="primary" id="nextBtn">다음 상자</button>
      </div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(() => {
'use strict';
// LOGIC START
// Cubes are [x, y, z] with y up. A piece is a list of cubes; orientations are normalised (min corner at 0).
const keyC = ([x, y, z]) => `${x},${y},${z}`;
function normalize(cs) {
  const mx = Math.min(...cs.map(c => c[0])), my = Math.min(...cs.map(c => c[1])), mz = Math.min(...cs.map(c => c[2]));
  return cs.map(([x, y, z]) => [x - mx, y - my, z - mz]).sort((a, b) => a[1] - b[1] || a[2] - b[2] || a[0] - b[0]);
}
const shapeKey = cs => normalize(cs).map(keyC).join(';');
const yaw = cs => normalize(cs.map(([x, y, z]) => [-z, y, x]));     // turn around the vertical axis
const pitch = cs => normalize(cs.map(([x, y, z]) => [x, -z, y]));   // tip forward
const roll = cs => normalize(cs.map(([x, y, z]) => [-y, x, z]));    // tip sideways
const TURNS = { yaw, pitch, roll };

// iso drawing of a piece for the tray, turned to match the current view
function pieceSVG(cs, color, view) {
  const turned = cs.map(([x, y, z]) => { let p = [x, y, z]; for (let i = 0; i < ((view % 4) + 4) % 4; i++) p = [p[2], p[1], -p[0]]; return p; });
  const n = normalize(turned);
  const s = 12, iso = ([x, y, z]) => [(x - z) * s * 0.87, (x + z) * s * 0.5 - y * s];
  const shade = (hex, f) => { const v = parseInt(hex.slice(1), 16); const ch = sh => Math.max(0, Math.min(255, Math.round(((v >> sh) & 255) * f))); return `rgb(${ch(16)},${ch(8)},${ch(0)})`; };
  const order = n.slice().sort((a, b) => (a[0] + a[2]) - (b[0] + b[2]) || a[1] - b[1]);
  let out = '', minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
  for (const c of order) {
    const [x, y, z] = c;
    const P = (dx, dy, dz) => iso([x + dx, y + dy, z + dz]);
    const top = [P(0, 1, 0), P(1, 1, 0), P(1, 1, 1), P(0, 1, 1)];
    const right = [P(1, 1, 0), P(1, 1, 1), P(1, 0, 1), P(1, 0, 0)];
    const left = [P(0, 1, 1), P(1, 1, 1), P(1, 0, 1), P(0, 0, 1)];

  const say = {
    undo: '정답과 다르게 넣은 짐이 있어요. 되돌리기를 눌러 보세요.',
    select: '반짝이는 짐을 골라 보세요.',
    turn: `${{ yaw: '돌리기', pitch: '세우기', roll: '눕히기' }[coach.name]} 버튼으로 모양을 맞춰요.`,
    move: '상자 위의 노란 자리를 눌러 짐을 옮겨요.',
    place: '좋아요! 넣기를 눌러요.',
  }[coach.kind];
  if (L.coach) setTip(say); else toast(say);
  if (coach.kind === 'undo') $('#undoBtn').classList.add('coach');
  if (coach.kind === 'select') { const el = document.querySelector(`.item[data-k="${coach.k}"]`); if (el) { el.classList.add('coach'); el.scrollIntoView({ block: 'nearest', inline: 'center' }); } }
  if (coach.kind === 'turn') document.querySelector(`[data-turn="${coach.name}"]`).classList.add('coach');
  if (coach.kind === 'place') $('#placeBtn').classList.add('coach');
  if (coach.kind === 'move') {
    targetGlow = new THREE.Group();
    for (const [x, y, z] of coach.cells) { const c = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ color: 0xffc83d, transparent: true, opacity: 0.35, depthWrite: false })); c.position.copy(cellPos(x, y, z)); targetGlow.add(c); }
    add(targetGlow);
  }
}
$('#hintBtn').addEventListener('click', () => { if (mode !== 'play' || won) return; hintUntil = performance.now() + 5000; updateCoach(); setTimeout(updateCoach, 5100); });

// ---------- camera ----------
function fitCamera() {
  const w = window.innerWidth, h = window.innerHeight, aspect = w / h;
  renderer.setSize(w, h, false);
  const dockH = $('#dock').hidden ? 0 : $('#dock').offsetHeight;
  document.documentElement.style.setProperty('--dock-h', `${dockH}px`);
  const W = box ? box.W : 3, D = box ? box.D : 3, H = box ? box.H : 3;
  const span = (W + D) * 0.72 + 3.2, tall = (W + D) * 0.42 + H * 0.85 + 2.2;
  // keep room for the HUD above and the dock below
  const usable = Math.max(0.35, 1 - (dockH + 150) / h);
  const fh = Math.max(tall / usable, span / aspect);
  camera.left = -fh * aspect / 2; camera.right = fh * aspect / 2; camera.top = fh / 2; camera.bottom = -fh / 2;
  camera.updateProjectionMatrix();
  const shift = ((dockH - 150) / h) * fh * 0.5;
  camera.position.set(10, 9.5 + H * 0.3, 10);
  camera.lookAt(0, H * 0.35 - shift * 0.9, 0);
}
window.addEventListener('resize', fitCamera);

// ---------- input ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function columnAt(e) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObject(columnPlane, false)[0];
  if (!hit) return null;
  const p = pivot.worldToLocal(hit.point.clone());
  return [Math.floor(p.x + box.W / 2), Math.floor(p.z + box.D / 2)];
}
function moveTo(col) {
  if (!col || selected < 0) return;
  // put the piece's footprint centre under the finger
  const [fw, fd] = footprint(shape);
  const a = clampAnchor([col[0] - Math.floor((fw - 1) / 2), col[1] - Math.floor((fd - 1) / 2)], shape);
  if (a[0] !== anchor[0] || a[1] !== anchor[1]) { anchor = a; updateGhost(); updateCoach(); }
}
let drag = null, lastTap = 0;
canvas.addEventListener('pointerdown', e => {
  Sound.ensure();
  if (mode !== 'play') return;
  canvas.setPointerCapture(e.pointerId);
  const col = columnAt(e);
  const onBox = col && col[0] >= -1 && col[1] >= -1 && col[0] <= box.W && col[1] <= box.D;
  drag = { x: e.clientX, rot: viewRot, place: onBox && selected >= 0, moved: false };
  if (drag.place) moveTo(col);
});
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  if (drag.place) { moveTo(columnAt(e)); return; }
  const dx = e.clientX - drag.x;
  if (Math.abs(dx) > 8) { drag.moved = true; viewRot = drag.rot + dx * 0.01; }
});
canvas.addEventListener('pointerup', () => {
  if (drag && !drag.place && drag.moved) { viewQ = Math.round(viewRot / (Math.PI / 2)); renderTray(); }
  if (drag && drag.place) { const now = performance.now(); if (now - lastTap < 320) place(); lastTap = now; }
  drag = null;
});
canvas.addEventListener('pointercancel', () => { drag = null; });
function turnView(d) { viewQ += d; renderTray(); }
$('#viewL').addEventListener('click', () => turnView(-1));
$('#viewR').addEventListener('click', () => turnView(1));
document.querySelectorAll('[data-turn]').forEach(b => b.addEventListener('click', () => turn(b.dataset.turn)));
$('#placeBtn').addEventListener('click', place);
$('#undoBtn').addEventListener('click', undo);
$('#resetBtn').addEventListener('click', () => startLevel(levelIndex, true));
document.addEventListener('keydown', e => {
  if (mode !== 'play') return;
  const mv = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.code];
  if (mv && selected >= 0) { e.preventDefault(); anchor = clampAnchor([anchor[0] + mv[0], anchor[1] + mv[1]], shape); updateGhost(); updateCoach(); }
  if (e.code === 'KeyQ') turn('yaw'); if (e.code === 'KeyW') turn('pitch'); if (e.code === 'KeyE') turn('roll');
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); place(); }
  if (e.code === 'KeyZ' || e.code === 'Backspace') undo();
  if (e.code === 'Tab') { e.preventDefault(); const left = L.pieces.map((_, k) => k).filter(k => !placedOrder.includes(k)); if (left.length) selectPiece(left[(left.indexOf(selected) + 1) % left.length]); }
});

// ---------- UI ----------
let toastTimer = 0;
function toast(text) { const t = $('#toast'); t.textContent = text; t.hidden = false; t.style.animation = 'none'; void t.offsetWidth; t.style.animation = ''; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600); }
let tipOpen = false;
function setTip(text) { $('#tipText').textContent = text; tipOpen = true; $('#tip').hidden = mode !== 'play'; }
function hideTip() { tipOpen = false; $('#tip').hidden = true; }
$('#tip').addEventListener('click', hideTip);
function updateHUD() {
  if (!L || !(mode === 'play' || mode === 'clear' || mode === 'intro')) return;
  $('#stageTitle').textContent = `${levelIndex + 1}. ${L.name}`;
  $('#moveLabel').textContent = `되돌리기 ${undos}번 · 짐 ${placedOrder.length}/${L.pieces.length}`;
  const empty = box.cells - box.filled.size;
  const chips = [`<span class="goal ${empty === 0 ? 'done' : ''}"><i style="background:#c99a62"></i>${empty === 0 ? '상자가 꽉 찼어요' : `빈칸 ${empty}개 남음`}</span>`];
  if (L.pieces.some(p => p.fragile)) chips.push('<span class="goal"><i style="background:#bfe3f2"></i>그릇 위엔 짐 금지</span>');
  if (L.pieces.some(p => p.heavy)) chips.push('<span class="goal"><i style="background:#9a6644"></i>책은 바닥에</span>');
  if ((L.cats || []).length) chips.push('<span class="goal"><i style="background:#f2b46d"></i>고양이 칸 비우기</span>');
  $('#goals').innerHTML = chips.join('');
  $('#undoBtn').disabled = !placedOrder.length || won;
}
function renderSound() {
  $('#soundBtn').setAttribute('aria-label', save.sound ? '소리 끄기' : '소리 켜기');
  $('#soundIcon').innerHTML = save.sound ? '<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>' : '<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/>';
}
$('#soundBtn').addEventListener('click', () => { Sound.setOn(!save.sound); renderSound(); });
function flowerIcons(n, total = 3, cls = '') { let s = ''; for (let i = 0; i < total; i++) s += `<svg class="${i < n ? 'f-on ' + cls : 'f-off'}" style="animation-delay:${i * 0.15}s" aria-hidden="true"><use href="#flower"/></svg>`; return s; }
function totals() { const recs = Object.values(save.levels); return { done: recs.length, fl: recs.reduce((s, r) => s + r.flowers, 0) }; }
function progressText() { const t = totals(); return t.done ? `상자 ${t.done}/${LEVELS.length} · 꽃 ${t.fl}/${LEVELS.length * 3}` : '기록은 이 브라우저에 저장돼요'; }
function showScreen(name) {
  mode = name;
  for (const id of ['title', 'select', 'clear', 'intro', 'dex']) $('#' + id).hidden = name !== id;
  $('#hud').hidden = !(name === 'play' || name === 'clear' || name === 'intro');
  $('#dock').hidden = $('#sideL').hidden = $('#sideR').hidden = name !== 'play';
  $('#tip').hidden = name !== 'play' || !tipOpen;
  if (name !== 'play') $('#toast').hidden = true;
  fitCamera();
  updateGhost();
}
function firstUnfinished() { for (let i = 0; i < LEVELS.length; i++) if (!isCleared(i)) return i; return LEVELS.length - 1; }
function startLevel(i, restart) {
  tipOpen = false;
  if (LEVELS[i].coach) setTip(COACH_TEXT[LEVELS[i].intro]);
  else if (LEVELS[i].tip) setTip(LEVELS[i].tip);
  if (LEVELS[i].intro && !save.seen[LEVELS[i].intro] && !restart) { buildLevel(i); showIntro(LEVELS[i].intro, true); }
  else { mode = 'play'; buildLevel(i); showScreen('play'); }
  updateHUD(); updateCoach();
}
function showIntro(key, beforePlay) {
  const g = GIMMICKS[key];
  $('#introTag').textContent = key === 'pack' ? '게임 목표' : beforePlay ? '새로운 짐' : '짐싸기 도감';
  $('#introArt').innerHTML = g.art; $('#introTitle').textContent = g.name; $('#introText').textContent = g.text;
  $('#introGo').textContent = beforePlay ? '해볼게요' : '닫기';
  $('#introGo').onclick = () => { if (beforePlay) { save.seen[key] = true; writeSave(); showScreen('play'); updateCoach(); } else openDex(); };
  showScreen('intro'); $('#introGo').focus();
}
let dexFrom = 'play';
function openDex() {
  if (mode !== 'dex' && mode !== 'intro') dexFrom = mode;
  const reach = Math.max(firstUnfinished(), mode === 'play' ? levelIndex : 0);
  const open = new Set(LEVELS.slice(0, reach + 1).map(l => l.intro).filter(Boolean).concat(Object.keys(save.seen)));
  $('#dexList').replaceChildren(...GIMMICK_ORDER.map(k => {
    const g = GIMMICKS[k], el = document.createElement('button');
    el.type = 'button'; el.className = 'dex-item' + (open.has(k) ? '' : ' locked'); el.disabled = !open.has(k);
    el.innerHTML = `<svg viewBox="0 0 64 64" aria-hidden="true">${open.has(k) ? g.art : '<circle cx="32" cy="32" r="22" fill="#e8dfd2"/>'}</svg><span><b></b><small></small></span>`;
    el.querySelector('b').textContent = open.has(k) ? g.name : '아직 못 만났어요';
    el.querySelector('small').textContent = open.has(k) ? g.text : '방을 지나가면 만날 수 있어요';
    if (open.has(k)) el.addEventListener('click', () => showIntro(k, false));
    return el;
  }));
  showScreen('dex');
}
$('#helpBtn').addEventListener('click', openDex);
$('#closeDex').addEventListener('click', () => { if (dexFrom === 'play') { showScreen('play'); updateCoach(); } else if (dexFrom === 'select') openSelect(); else showTitle(); });
let selectFrom = 'title', selectChapter = 0;
function openSelect() { if (mode !== 'select' && mode !== 'dex') selectFrom = mode; selectChapter = chapterOf(mode === 'play' || mode === 'clear' ? levelIndex : firstUnfinished()); renderSelect(); showScreen('select'); }
function renderSelect() {
  const next = firstUnfinished();
  $('#chapters').replaceChildren(...ROOMS.map((r, k) => {
    const el = document.createElement('button');
    el.type = 'button'; el.role = 'tab'; el.setAttribute('aria-selected', String(k === selectChapter)); el.disabled = !isOpen(k * PER_ROOM);
    const done = [...Array(PER_ROOM).keys()].filter(j => isCleared(k * PER_ROOM + j)).length;
    el.innerHTML = `<b>${k + 1}</b><span></span><small>${el.disabled ? '잠김' : `${done}/${PER_ROOM}`}</small>`;
    el.querySelector('span').textContent = r.name;
    el.addEventListener('click', () => { selectChapter = k; renderSelect(); });
    return el;
  }));
  const strip = $('#chapters'), sel = strip.children[selectChapter];
  if (sel) strip.scrollLeft = sel.offsetLeft - (strip.clientWidth - sel.offsetWidth) / 2;
  const rr = ROOMS[selectChapter];
  $('#villageGim').textContent = rr.mix ? `이 방 · ${rr.mix}` : `이 방에서 만나는 짐 · ${GIMMICKS[rr.gim].name}`;
  $('#stages').replaceChildren(...LEVELS.slice(selectChapter * PER_ROOM, (selectChapter + 1) * PER_ROOM).map((l, j) => {
    const i = selectChapter * PER_ROOM + j, rec = save.levels[i], el = document.createElement('button');
    el.type = 'button'; el.className = 'stage' + (rec ? ' cleared' : '') + (i === next && !rec ? ' next' : ''); el.disabled = !isOpen(i);
    el.innerHTML = `<span class="num">${i + 1}</span><span class="nm"></span><span class="flowers">${el.disabled ? '' : flowerIcons(rec ? rec.flowers : 0)}</span>`;
    el.querySelector('.nm').textContent = el.disabled ? '잠김' : l.coach ? '배워 보기' : `${l.size.join('×')} 상자`;
    el.setAttribute('aria-label', `${i + 1}. ${l.name}${el.disabled ? ' (잠김)' : rec ? `, 꽃 ${rec.flowers}송이` : ''}`);
    el.addEventListener('click', () => startLevel(i));
    return el;
  }));
  $('#selectNote').textContent = progressText();
}
$('#playBtn').addEventListener('click', () => { Sound.ensure(); startLevel(firstUnfinished()); });
$('#stagesBtn').addEventListener('click', () => { Sound.ensure(); openSelect(); });
$('#toSelect').addEventListener('click', openSelect);
$('#closeSelect').addEventListener('click', () => { if (selectFrom === 'play') showScreen('play'); else showTitle(); });
function showClear() {
  const fl = flowersFor(undos), prev = save.levels[levelIndex];
  save.levels[levelIndex] = { undos: prev ? Math.min(prev.undos, undos) : undos, flowers: Math.max(prev ? prev.flowers : 0, fl) };
  writeSave();
  const last = levelIndex === LEVELS.length - 1, roomEnd = levelIndex % PER_ROOM === PER_ROOM - 1;
  $('#clearTitle').textContent = last ? '이사 준비 끝!' : roomEnd ? `${ROOMS[chapterOf(levelIndex)].name} 끝!` : '상자를 꽉 채웠어요';
  $('#bigFlowers').innerHTML = flowerIcons(fl, 3, 'f-on-anim');
  const stats = [`되돌리기 ${undos}번`];
  if (fl < 3) stats.push('되돌리기 없이 채우면 꽃 3송이');
  $('#clearStats').replaceChildren(...stats.map(t => Object.assign(document.createElement('span'), { textContent: t })));
  const nextR = !last && roomEnd ? ROOMS[chapterOf(levelIndex) + 1] : null;
  $('#clearNext').textContent = nextR ? (nextR.mix ? `다음 방 ${nextR.name}: ${nextR.mix}` : `다음 방 ${nextR.name}에서 새 짐 '${GIMMICKS[nextR.gim].name}'을 만나요`) : '';
  $('#clearNext').hidden = !nextR;
  $('#nextBtn').textContent = last ? '스테이지 목록' : roomEnd ? '다음 방으로' : '다음 상자';
  hideTip(); showScreen('clear');
}
$('#againBtn').addEventListener('click', () => startLevel(levelIndex, true));
$('#nextBtn').addEventListener('click', () => { if (levelIndex === LEVELS.length - 1) openSelect(); else startLevel(levelIndex + 1); });

// the title screen packs a box by itself
let demoT = 0;
function showTitle() {
  tipOpen = false;
  mode = 'title';
  buildLevel(5);
  $('#playBtn').textContent = totals().done ? '이어하기' : '시작하기';
  $('#progressNote').textContent = progressText();
  showScreen('title');
}
function demoStep() {
  const k = L.order.find(i => !placedOrder.includes(i));
  if (k === undefined) { if (!won) { won = true; closeT = 0; } else if (closeT > 3) buildLevel(5); return; }
  const cells = L.pieces[k].cells;
  for (const c of cells) box.filled.set(keyC(c), k);
  placedOrder.push(k); addPieceMesh(k, cells);
}

// ---------- animation ----------
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  const target = mode === 'title' && !reduced ? viewRot + dt * 0.25 : viewQ * Math.PI / 2;
  if (!drag || drag.place) viewRot += (target - viewRot) * Math.min(1, dt * (mode === 'title' ? 60 : 8));
  pivot.rotation.y = viewRot;
  if (mode === 'title') { demoT += dt; if (demoT > 0.9) { demoT = 0; demoStep(); } }
  for (const d of drops) { d.t += dt; const k = Math.min(1, d.t / 0.35); d.g.position.y = 2.2 * (1 - k * k) + (k >= 1 ? 0 : 0); if (k >= 1 && !d.done) { d.done = true; d.g.position.y = 0; } }
  drops = drops.filter(d => !d.done);
  for (const m of Object.values(GHOST_MAT)) m.opacity = 0.4 + Math.sin(t * 5) * 0.12;
  if (targetGlow) targetGlow.children.forEach(c => { c.material.opacity = 0.25 + Math.sin(t * 6) * 0.15; });
  // flaps: open while packing, fold shut when the box is full
  if (closeT >= 0) closeT += dt;
  const shut = won ? Math.min(1, Math.max(0, (closeT - 0.4) / 0.6)) : 0;
  flaps.forEach(({ hinge, axis, sgn }, n) => {
    const open = sgn * 2.55, closed = 0, k = n < 2 ? Math.min(1, shut * 1.6) : Math.max(0, shut * 1.6 - 0.6);
    const ang = open + (closed - open) * k;
    if (axis === 'x') hinge.rotation.x = ang; else hinge.rotation.z = -ang;
    hinge.position.y = box.H + (k > 0.98 ? (n < 2 ? 0.0 : 0.04) : 0);
  });
  if (tape) tape.visible = won && closeT > 1.1, tape.position.y = box.H + 0.08;
  if (capy) {
    const happy = won && closeT > 1.2;
    capy.position.y = -0.04 + (happy && !reduced ? Math.abs(Math.sin(t * 7)) * 0.2 : Math.sin(t * 1.5) * 0.006);
    for (const e of capy.userData.eyes) e.scale.y = 0.036 * (happy ? 0.2 : 1);
  }
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

// ---------- boot ----------
renderSound();
window.claude?.hot?.snapshot?.(() => ({ mode, levelIndex }));
function boot(data) {
  if (data && data.mode === 'play' && Number.isInteger(data.levelIndex)) startLevel(data.levelIndex, true);
  else showTitle();
  requestAnimationFrame(tick);
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
