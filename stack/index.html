<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="흔들리는 가지에서 과일을 떨어뜨려 카피바라 머리 위에 쌓는 균형 게임">
<style>[hidden]{display:none!important}</style>
<title>유자 쌓기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one full-screen canvas; HUD on top, overlay cards for start and results.
   One deliberate look: a soft sky that climbs from meadow to stars as the tower grows. */
:root {
  --ink: #2b3330;
  --panel: #fffdf8;
  --panel-line: #e9dfcd;
  --yuzu: #ffa236;
  --yuzu-deep: #dd7a0e;
  --muted: #6d7873;
  --heart: #ff6b7d;
  --f-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; overflow: hidden; background: #cfeaf5; color: var(--ink); font-family: var(--f-body); }
#app { position: relative; height: 100%; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--yuzu); outline-offset: 2px; }
.hud { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: max(12px, env(safe-area-inset-top, 0px)) 14px 0; pointer-events: none; }
.hud > * { pointer-events: auto; }
.score { font-family: var(--f-display); font-size: 40px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 rgba(255,255,255,.7); }
.score small { display: block; font-size: 14px; margin-top: 4px; color: var(--muted); }
.right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.row { display: flex; gap: 8px; align-items: center; }
.hearts { display: flex; gap: 2px; }
.hearts svg { width: 22px; height: 22px; }
.next { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: rgba(255,253,248,.92); font-size: 13px; box-shadow: 0 4px 12px rgba(0,0,0,.1); }
.next canvas { width: 28px; height: 24px; }
.round { width: 42px; height: 42px; border-radius: 50%; border: 0; display: grid; place-items: center; background: rgba(255,253,248,.92); box-shadow: 0 4px 12px rgba(0,0,0,.12); }
.round svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.overlay { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px)); }
.card { width: min(400px, 100%); background: var(--panel); border-radius: 26px; padding: 22px; text-align: center; box-shadow: 0 6px 0 var(--panel-line), 0 24px 60px rgba(0,0,0,.18); }
h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(34px, 10vw, 46px); line-height: 1.05; }
h1 em { font-style: normal; color: var(--yuzu-deep); }
.card p { margin: 10px auto 16px; color: var(--muted); max-width: 26em; text-wrap: balance; }
.howto { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 0 18px; }
.howto div { background: #f6f1e7; border-radius: 16px; padding: 10px 6px; font-size: 12px; line-height: 1.35; }
.howto svg { display: block; width: 34px; height: 34px; margin: 0 auto 4px; }
.primary { border: 0; border-radius: 18px; padding: 14px 26px; min-width: 180px; background: var(--yuzu); color: #fff; font-family: var(--f-display); font-size: 21px; box-shadow: 0 5px 0 var(--yuzu-deep); }
.primary:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--yuzu-deep); }
.note { margin-top: 12px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.result h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 30px; }
.big { font-family: var(--f-display); font-size: 54px; line-height: 1.1; color: var(--yuzu-deep); font-variant-numeric: tabular-nums; }
.newbest { display: inline-block; padding: 2px 12px; border-radius: 999px; background: var(--yuzu); color: #fff; font-family: var(--f-display); font-size: 15px; animation: pulse .8s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.08); } }
.stats { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 12px 0 18px; }
.stats span { padding: 4px 12px; border-radius: 999px; background: #f3ede2; font-size: 14px; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { .newbest { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <canvas id="game" aria-label="카피바라 머리 위에 유자를 쌓아요. 탭하면 유자가 떨어지고, 좌우로 끌면 카피바라가 움직여요."></canvas>

  <header class="hud" id="hud" hidden>
    <div class="score"><span id="count">0</span><small id="height"></small></div>
    <div class="right">
      <div class="row">
        <div class="hearts" id="hearts" aria-label="목숨"></div>
        <button type="button" class="round" id="soundBtn" aria-label="소리 끄기"><svg viewBox="0 0 24 24" id="soundIcon"></svg></button>
      </div>
      <span class="next">다음 <canvas id="nextCv" width="56" height="48"></canvas><span id="nextName"></span></span>
    </div>
  </header>

  <section class="overlay" id="start">
    <div class="card">
      <h1>유자 <em>쌓기</em></h1>
      <p>흔들리는 가지에서 과일을 떨어뜨려 카피바라 머리 위에 쌓아요. 탑이 기울면 카피바라를 움직여 균형을 잡아요.</p>
      <div class="howto">
        <div><svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="9" fill="none" stroke="#2b3330" stroke-width="2.4"/><circle cx="17" cy="17" r="3.5" fill="#ffa236"/></svg>탭하면<br>떨어뜨리기</div>
        <div><svg viewBox="0 0 34 34" aria-hidden="true"><path d="M5 17h24M10 12l-5 5 5 5M24 12l5 5-5 5" stroke="#2b3330" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>좌우로 끌어<br>균형 잡기</div>
        <div><svg viewBox="0 0 34 34" aria-hidden="true"><path d="M17 28 C 6 20 4 12 10 9 C 14 7 17 11 17 11 C 17 11 20 7 24 9 C 30 12 28 20 17 28 Z" fill="#ff6b7d"/></svg>떨어지면<br>목숨 하나</div>
      </div>
      <button type="button" class="primary" id="goBtn">쌓기 시작</button>
      <div class="note" id="startNote"></div>
    </div>
  </section>

  <section class="overlay" id="result" hidden>
    <div class="card result">
      <h2 id="resultTitle">와르르!</h2>
      <div class="big" id="resultScore">0</div>
      <span class="newbest" id="newBest" hidden>최고 기록!</span>
      <div class="stats" id="resultStats"></div>
      <button type="button" class="primary" id="againBtn">다시 쌓기</button>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const { Engine, Bodies, Body, Composite, Constraint, Events } = Matter;

// ---------- save ----------
const SAVE_KEY = 'yuzu-stack:v1';   // shared localStorage on starone99.github.io, so keys carry a game prefix
function loadSave() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { /* storage unavailable */ }
  if (!s || typeof s.bestCount !== 'number') s = { bestCount: 0, bestHeight: 0, plays: 0, sound: true };
  return s;
}
const save = loadSave();
function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* storage unavailable */ } }

// ---------- sound ----------
const Sound = {
  ctx: null, master: null, noiseBuf: null,
  ensure() {
    if (!save.sound) return null;
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.85; this.master.connect(this.ctx.destination);
      this.noiseBuf = this.ctx.createBuffer(1, this.ctx.sampleRate, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  tone(freq, dur, { type = 'sine', gain = 0.12, to = null, delay = 0 } = {}) {
    const ctx = this.ensure(); if (!ctx) return;
    const t = ctx.currentTime + delay, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, { freq = 1000, q = 1, gain = 0.1, delay = 0, type = 'bandpass', to = null } = {}) {
    const ctx = this.ensure(); if (!ctx) return;
    const t = ctx.currentTime + delay, src = ctx.createBufferSource(); src.buffer = this.noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (to) f.frequency.exponentialRampToValueAtTime(to, t + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master); src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
  },
  drop() { this.noise(0.18, { freq: 2200, q: 1, gain: 0.05, to: 900 }); },
  land(size) { const f = 330 - size * 2.2; this.tone(f, 0.14, { type: 'triangle', gain: 0.14, to: f * 0.7 }); this.noise(0.07, { freq: 600, q: 1, gain: 0.05 }); },
  perfect(streak) { const b = 784 * Math.pow(2, Math.min(streak, 8) / 12); [b, b * 1.25, b * 1.5].forEach((f, i) => this.tone(f, 0.25, { gain: 0.06, delay: i * 0.06 })); },
  fall() { this.tone(700, 0.5, { type: 'triangle', gain: 0.08, to: 160 }); },
  creak() { this.tone(180 + Math.random() * 40, 0.25, { type: 'sawtooth', gain: 0.025, to: 140 }); },
  honey() { this.tone(260, 0.3, { gain: 0.08, to: 200 }); this.noise(0.2, { freq: 400, q: 2, gain: 0.04 }); },
  ice() { [1568, 2093, 2637].forEach((f, i) => this.tone(f, 0.3, { gain: 0.04, delay: i * 0.05 })); },
  wind() { this.noise(1.6, { freq: 500, q: 0.6, gain: 0.05, to: 900 }); },
  milestone() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.5, { gain: 0.06, delay: i * 0.1 })); },
  setOn(on) { save.sound = on; writeSave(); if (this.master) this.master.gain.value = on ? 0.85 : 0; if (on) this.ensure(); },
};

// ---------- fruits ----------
const FRUITS = {
  yuzu:  { name: '유자',   w: 58, h: 48, ch: 18, color: '#ffa236', light: '#ffc56b', density: 0.0012, weight: 4 },
  gyul:  { name: '귤',     w: 46, h: 38, ch: 14, color: '#ff8a2a', light: '#ffb06b', density: 0.0011, weight: 3 },
  halla: { name: '한라봉', w: 68, h: 58, ch: 22, color: '#ff9a1f', light: '#ffc06b', density: 0.0014, weight: 2, bump: true },
  lemon: { name: '레몬',   w: 80, h: 40, ch: 18, color: '#ffd84a', light: '#fff09a', density: 0.0011, weight: 2 },
  honey: { name: '꿀 유자', w: 58, h: 48, ch: 18, color: '#ffb31a', light: '#ffe08a', density: 0.0012, weight: 0, special: 'honey' },
  ice:   { name: '얼음 유자', w: 58, h: 48, ch: 18, color: '#9fd8f2', light: '#e6f7ff', density: 0.0012, weight: 0, special: 'ice' },
};
function nextKind(count) {
  if (count >= 4 && Math.random() < 0.09) return 'honey';
  if (count >= 8 && Math.random() < 0.07) return 'ice';
  const pool = [];
  for (const [k, f] of Object.entries(FRUITS)) for (let i = 0; i < f.weight; i++) if (count >= 3 || k === 'yuzu' || k === 'gyul') pool.push(k);
  return pool[Math.floor(Math.random() * pool.length)];
}

// ---------- canvas ----------
const cv = $('#game'), g = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, GROUND = 0, WG = 0;   // GROUND follows the screen, WG is the world floor fixed at reset
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  GROUND = H - Math.max(70, H * 0.09);
}
window.addEventListener('resize', resize); resize();

// ---------- state ----------
let engine, head, fruits = [], state = 'title', t = 0, camY = 0, camTarget = 0;
let hearts = 3, count = 0, bestTop = 0, perfectStreak = 0, maxCount = 0, holding = null, nextK = 'yuzu', dropCooldown = 0;
let swing = { x: 0, phase: 0, speed: 1.4, amp: 110 }, wind = 0, windT = 0, windIn = 0, freezeT = 0;
let lastLoss = -9, parts = [], texts = [], milestonesHit = new Set(), creakT = 0, sweat = 0, headX = 0, headTarget = 0, refillT = 0, overT = -1;
const HEAD_W = 128, HEAD_H = 22;
const headTopY = () => WG - 150;   // where the capybara's head platform sits

function reset() {
  WG = GROUND;
  engine = Engine.create({ gravity: { x: 0, y: 1, scale: 0.0012 }, positionIterations: 24, velocityIterations: 18, constraintIterations: 4 });
  headX = headTarget = W / 2;
  head = Bodies.rectangle(headX, headTopY() + HEAD_H / 2, HEAD_W, HEAD_H, { chamfer: { radius: 10 }, friction: 1, frictionStatic: 1.5, isStatic: true, label: 'head' });
  const ground = Bodies.rectangle(W / 2, WG + 50, W * 6, 100, { isStatic: true, label: 'ground' });
  Composite.add(engine.world, [head, ground]);
  Events.on(engine, 'collisionStart', onCollide);
  fruits = []; hearts = 3; count = 0; maxCount = 0; bestTop = 0; perfectStreak = 0; camY = camTarget = 0; t = 0;
  swing = { x: W / 2, phase: 0, speed: 1.3, amp: Math.min(W * 0.28, 130) };
  wind = 0; windT = 0; windIn = 14; freezeT = 0; refillT = 0; overT = -1; lastLoss = -9; parts = []; texts = []; milestonesHit = new Set();
  nextK = 'yuzu'; holding = makeHeld(nextK); nextK = nextKind(1); dropCooldown = 0;
  renderHearts(); drawNext();
}
const branchY = () => Math.min(headTopY() - 220, towerTop() - 170);
function towerTop() {
  let top = headTopY();
  for (const f of fruits) if (f.stacked) top = Math.min(top, f.body.bounds.min.y);
  return top;
}
function makeHeld(kind) { return { kind, x: W / 2 }; }
function dropFruit() {
  if (!holding || dropCooldown > 0 || state !== 'play') return;
  const F = FRUITS[holding.kind];
  const x = swing.x, y = branchY() + 46;
  const body = Bodies.rectangle(x, y, F.w, F.h, { chamfer: { radius: Math.round(F.ch * 0.4) }, friction: 1, frictionStatic: 2, restitution: 0, density: F.density, frictionAir: 0.02, slop: 0.02, label: 'fruit' });
  // carry a little of the swing so timing matters
  Body.setVelocity(body, { x: Math.cos(swing.phase) * swing.speed * swing.amp * 0.004, y: 0 });
  Body.setAngle(body, rand(-0.04, 0.04));
  Composite.add(engine.world, body);
  fruits.push({ body, kind: holding.kind, born: t, landed: false, stacked: false, glued: false, squash: 0 });
  holding = null; dropCooldown = 0.55;
  Sound.drop();
  refillT = 0.45;
}
function onCollide(ev) {
  for (const p of ev.pairs) {
    for (const [a, b] of [[p.bodyA, p.bodyB], [p.bodyB, p.bodyA]]) {
      const f = fruits.find(x => x.body === a);
      if (!f || f.landed) continue;
      if (b.label === 'ground') continue;
      f.landed = true; f.squash = 1;
      Body.setVelocity(a, { x: a.velocity.x * 0.5, y: a.velocity.y * 0.25 });
      const F = FRUITS[f.kind];
      Sound.land(F.w);
      // perfect: right on top of whatever it landed on
      const dx = Math.abs(a.position.x - b.position.x);
      if (b.label !== 'ground' && dx < 7 && f.kind !== 'lemon') {
        perfectStreak++;
        Body.setPosition(a, { x: b.position.x, y: a.position.y });
        Body.setVelocity(a, { x: b.velocity.x, y: a.velocity.y });
        float(perfectStreak > 1 ? `퍼펙트 x${perfectStreak}!` : '퍼펙트!', a.position.x, a.position.y - 50, '#fff');
        Sound.perfect(perfectStreak);
        sparkle(a.position.x, a.position.y, 14, ['#fff6b0', '#ffd27a', '#ffffff']);
      } else if (dx > 7) perfectStreak = 0;
      if (F.special === 'honey') {
        const glue = Constraint.create({ bodyA: a, bodyB: b, pointA: { x: 0, y: 0 }, pointB: { x: a.position.x - b.position.x, y: a.position.y - b.position.y }, stiffness: 0.9, damping: 0.2, length: 0 });
        // keep the angle too: a second point
        const glue2 = Constraint.create({ bodyA: a, bodyB: b, pointA: { x: 20, y: 0 }, pointB: { x: a.position.x + 20 - b.position.x, y: a.position.y - b.position.y }, stiffness: 0.9, damping: 0.2, length: 0 });
        Composite.add(engine.world, [glue, glue2]);
        f.glued = true; Sound.honey(); float('찰싹 붙었어요', a.position.x, a.position.y - 50, '#ffe08a');
      }
      if (F.special === 'ice') { freezeT = 4; Sound.ice(); float('탑이 꽁꽁 얼었어요', a.position.x, a.position.y - 50, '#d6f2ff'); sparkle(a.position.x, a.position.y, 16, ['#e6f7ff', '#9fd8f2', '#ffffff']); }
    }
  }
}
function sparkle(x, y, n, colors) { for (let i = 0; i < n; i++) parts.push({ x, y, vx: rand(-160, 160), vy: rand(-260, -40), g: 420, life: rand(0.5, 0.9), age: 0, r: rand(2, 5), c: colors[i % colors.length] }); }
function float(text, x, y, color, life = 1, size = 26) { texts.push({ text, x: clamp(x, 80, W - 80), y, color, life, age: 0, size }); }

// ---------- input: tap drops, horizontal drag moves the capybara ----------
let touch = null;
cv.addEventListener('pointerdown', e => {
  Sound.ensure();
  if (state !== 'play') return;
  cv.setPointerCapture(e.pointerId);
  touch = { x: e.clientX, y: e.clientY, t: performance.now(), startHead: headTarget, moved: false };
});
cv.addEventListener('pointermove', e => {
  if (!touch) return;
  const dx = e.clientX - touch.x;
  if (Math.abs(dx) > 8) touch.moved = true;
  if (touch.moved) headTarget = clamp(touch.startHead + dx, HEAD_W / 2 + 10, W - HEAD_W / 2 - 10);
});
cv.addEventListener('pointerup', e => {
  if (touch && !touch.moved && performance.now() - touch.t < 350) dropFruit();
  touch = null;
});
cv.addEventListener('pointercancel', () => { touch = null; });
document.addEventListener('keydown', e => {
  if (state !== 'play') return;
  if (e.code === 'Space') { e.preventDefault(); dropFruit(); }
  if (e.code === 'ArrowLeft') headTarget = clamp(headTarget - 30, HEAD_W / 2 + 10, W - HEAD_W / 2 - 10);
  if (e.code === 'ArrowRight') headTarget = clamp(headTarget + 30, HEAD_W / 2 + 10, W - HEAD_W / 2 - 10);
});
$('#goBtn').addEventListener('click', () => { Sound.ensure(); start(); });
$('#againBtn').addEventListener('click', () => { Sound.ensure(); start(); });
function renderSound() { $('#soundBtn').setAttribute('aria-label', save.sound ? '소리 끄기' : '소리 켜기'); $('#soundIcon').innerHTML = save.sound ? '<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>' : '<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/>'; }
$('#soundBtn').addEventListener('click', () => { Sound.setOn(!save.sound); renderSound(); });
function renderHearts() {
  $('#hearts').innerHTML = [0, 1, 2].map(i => `<svg viewBox="0 0 34 34" aria-hidden="true"><path d="M17 28 C 6 20 4 12 10 9 C 14 7 17 11 17 11 C 17 11 20 7 24 9 C 30 12 28 20 17 28 Z" fill="${i < hearts ? '#ff6b7d' : '#d9d2c6'}"/></svg>`).join('');
  $('#hearts').setAttribute('aria-label', `목숨 ${hearts}개`);
}
function drawNext() {
  const c = $('#nextCv'), x = c.getContext('2d'), F = FRUITS[nextK];
  x.clearRect(0, 0, 56, 48);
  const s = 40 / Math.max(F.w, F.h);
  drawFruitShape(x, 28, 24, F.w * s, F.h * s, F, 0);
  $('#nextName').textContent = F.name;
}

function start() {
  if (engine) { Composite.clear(engine.world, false); Engine.clear(engine); Events.off(engine); }
  reset(); state = 'play';
  $('#start').hidden = true; $('#result').hidden = true; $('#hud').hidden = false;
  float('탭해서 떨어뜨려요', W / 2, H * 0.42, '#2b3330', 1.6, 28);
  float('좌우로 끌면 균형 잡기', W / 2, H * 0.48, '#2b3330', 1.6, 22);
}

// ---------- update ----------
const MILESTONES = [[5, '첫 탑 완성!'], [10, '나무 높이까지!'], [20, '구름에 닿았어요!'], [30, '하늘을 뚫었어요!'], [45, '별이 보여요!']];
function update(dt) {
  t += dt;
  if (state !== 'play' && state !== 'falling') return;
  dropCooldown -= dt;
  if (!holding && state === 'play') { refillT -= dt; if (refillT <= 0) { holding = makeHeld(nextK); nextK = nextKind(count + 1); drawNext(); } }
  if (overT >= 0) { overT -= dt; if (overT < 0) gameOver(); }
  // the branch swings faster and wider as the tower grows
  swing.speed = 1.3 + Math.min(1.6, count * 0.05);
  swing.amp = Math.min(W * 0.32, 110 + count * 3);
  swing.phase += dt * swing.speed;
  swing.x = W / 2 + Math.sin(swing.phase) * swing.amp;
  // wind gusts later on
  if (count >= 12) {
    windIn -= dt;
    if (windIn <= 0 && windT <= 0) { windT = rand(2.5, 4); wind = (Math.random() < 0.5 ? -1 : 1) * (0.00012 + Math.min(0.00014, count * 0.000004)); windIn = rand(9, 15); Sound.wind(); float(wind > 0 ? '바람이 불어요 →' : '← 바람이 불어요', W / 2, 120 + camY * 0 + 60, '#2b3330', 1.4, 24); }
  }
  if (windT > 0) { windT -= dt; for (const f of fruits) if (f.stacked && freezeT <= 0) Body.applyForce(f.body, f.body.position, { x: wind * f.body.mass, y: 0 }); if (Math.random() < dt * 20) parts.push({ x: wind > 0 ? -10 : W + 10, y: rand(80, H * 0.7) - camY, vx: wind > 0 ? rand(300, 500) : -rand(300, 500), vy: rand(-20, 20), g: 0, life: 1.5, age: 0, r: rand(2, 4), c: 'rgba(120,170,110,0.7)', leaf: true }); }
  // the capybara follows your finger smoothly
  headX += (headTarget - headX) * Math.min(1, dt * 10);
  // freeze: heavy damping so the stack holds still
  for (const f of fruits) f.body.frictionAir = freezeT > 0 ? 0.25 : 0.012;
  if (freezeT > 0) freezeT -= dt;
  const steps = 4;
  const fromX = head.position.x;
  for (let i = 0; i < steps; i++) {
    Body.setPosition(head, { x: fromX + (headX - fromX) * (i + 1) / steps, y: headTopY() + HEAD_H / 2 }, true);
    Engine.update(engine, (dt * 1000) / steps);
  }
  // who is on the tower, who fell
  const ht = headTopY();
  let stackedNow = 0;
  for (const f of fruits) {
    if (f.fallen) { f.fallT += dt; continue; }
    const b = f.body;
    if (f.squash > 0) f.squash = Math.max(0, f.squash - dt * 5);
    const onGround = b.bounds.max.y > WG - 4;
    const off = b.position.x < -120 || b.position.x > W + 120 || b.position.y > WG + 200;
    if (onGround || off) {
      f.fallen = true; f.stacked = false; f.fallT = 0;
      const sameCollapse = t - lastLoss < 1.5;
      if (!sameCollapse) { hearts = Math.max(0, hearts - 1); renderHearts(); lastLoss = t; }
      perfectStreak = 0;
      Sound.fall();
      sparkle(clamp(b.position.x, 20, W - 20), Math.min(b.position.y, WG), 10, ['#ffa236', '#ffd27a']);
      if (!sameCollapse) float(hearts > 0 ? `떨어졌어요 (남은 목숨 ${hearts})` : '와르르!', clamp(b.position.x, 100, W - 100), WG - 120, '#ff6b7d', 1.2, 24);
      setTimeout(() => { Composite.remove(engine.world, b); }, 600);
      if (hearts <= 0 && state === 'play') { state = 'falling'; overT = 1.1; }
      continue;
    }
    f.stacked = f.landed && b.position.y < ht && Math.abs(b.velocity.y) < 6;
    if (f.stacked) stackedNow++;
  }
  count = stackedNow; maxCount = Math.max(maxCount, count);
  const top = towerTop();
  bestTop = Math.max(bestTop, ht - top);
  for (const [n, msg] of MILESTONES) if (count >= n && !milestonesHit.has(n)) { milestonesHit.add(n); Sound.milestone(); float(msg, W / 2, top - 80, '#fff', 1.6, 32); sparkle(W / 2, top - 40, 24, ['#fff6b0', '#ffd27a', '#ff9fb2', '#9fd8f2']); }
  // camera climbs with the tower
  camTarget = Math.max(0, (H * 0.55) - top);
  camY += (camTarget - camY) * Math.min(1, dt * 2.5);
  // tilt: how far the top of the tower leans from the head
  const topFruit = fruits.filter(f => f.stacked).sort((a, b) => a.body.position.y - b.body.position.y)[0];
  const lean = topFruit ? (topFruit.body.position.x - head.position.x) / HEAD_W : 0;
  sweat = clamp(Math.abs(lean) * 1.6 - 0.3, 0, 1);
  creakT -= dt;
  if (sweat > 0.5 && creakT <= 0) { Sound.creak(); creakT = 0.8; }
  for (const p of parts) { p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; }
  parts = parts.filter(p => p.age < p.life);
  for (const x of texts) x.age += dt;
  texts = texts.filter(x => x.age < x.life);
  $('#count').textContent = `${count}개`;
  $('#height').textContent = `높이 ${(Math.max(0, ht - top) / 4).toFixed(0)}cm · 최고 ${save.bestCount}개`;
}
function gameOver() {
  if (state === 'over') return;
  state = 'over';
  const cm = Math.round(bestTop / 4), isBest = maxCount > save.bestCount;
  save.plays++; if (isBest) save.bestCount = maxCount; save.bestHeight = Math.max(save.bestHeight, cm); writeSave();
  $('#resultTitle').textContent = isBest ? '새 기록이에요!' : '와르르!';
  $('#resultScore').textContent = `${maxCount}개`;
  $('#newBest').hidden = !isBest;
  const stats = [`가장 높이 ${cm}cm`, `최고 ${save.bestCount}개`, `최고 높이 ${save.bestHeight}cm`];
  $('#resultStats').replaceChildren(...stats.map(x => Object.assign(document.createElement('span'), { textContent: x })));
  $('#hud').hidden = true; $('#result').hidden = false;
}

// ---------- drawing ----------
function drawFruitShape(c, x, y, w, h, F, angle, squash = 0) {
  c.save(); c.translate(x, y); c.rotate(angle);
  c.scale(1 + squash * 0.12, 1 - squash * 0.12);
  const r = Math.min(w, h) * 0.42;
  c.fillStyle = F.color;
  c.beginPath(); c.roundRect ? c.roundRect(-w / 2, -h / 2, w, h, r) : c.rect(-w / 2, -h / 2, w, h); c.fill();
  if (F.bump) { c.beginPath(); c.arc(0, -h / 2 + 2, w * 0.16, Math.PI, 0); c.fill(); }
  // dimpled peel
  c.fillStyle = 'rgba(255,255,255,0.12)';
  for (let i = 0; i < 6; i++) { c.beginPath(); c.arc(-w * 0.3 + (i % 3) * w * 0.3, -h * 0.15 + Math.floor(i / 3) * h * 0.3, 1.6, 0, TAU); c.fill(); }
  c.fillStyle = F.light; c.beginPath(); c.ellipse(-w * 0.22, -h * 0.2, w * 0.14, h * 0.12, -0.4, 0, TAU); c.fill();
  c.fillStyle = '#5fae6b'; c.beginPath(); c.ellipse(w * 0.1, -h / 2 - (F.bump ? w * 0.12 : 2), w * 0.14, h * 0.08, -0.4, 0, TAU); c.fill();
  if (F.special === 'honey') { c.fillStyle = 'rgba(255,190,40,0.85)'; c.beginPath(); c.ellipse(0, h * 0.38, w * 0.38, h * 0.14, 0, 0, TAU); c.fill(); }
  if (F.special === 'ice') { c.strokeStyle = 'rgba(255,255,255,0.9)'; c.lineWidth = 2; c.beginPath(); c.moveTo(-w * 0.2, 0); c.lineTo(w * 0.2, 0); c.moveTo(0, -h * 0.2); c.lineTo(0, h * 0.2); c.stroke(); }
  // a tiny calm face
  c.strokeStyle = 'rgba(80,50,20,0.55)'; c.lineWidth = 1.6; c.lineCap = 'round';
  c.beginPath(); c.moveTo(-w * 0.14, h * 0.02); c.quadraticCurveTo(-w * 0.1, -h * 0.02, -w * 0.06, h * 0.02); c.moveTo(w * 0.06, h * 0.02); c.quadraticCurveTo(w * 0.1, -h * 0.02, w * 0.14, h * 0.02); c.stroke();
  c.restore();
}
function skyAt(heightPx) {
  // meadow blue -> evening -> night as the camera climbs
  const k = clamp(heightPx / 2600, 0, 1);
  const lerp = (a, b, u) => a.map((v, i) => Math.round(v + (b[i] - v) * u));
  const stops = [[[207, 234, 245], [255, 244, 222]], [[160, 196, 240], [246, 220, 238]], [[40, 52, 110], [120, 90, 160]]];
  const seg = k < 0.5 ? 0 : 1, u = k < 0.5 ? k * 2 : (k - 0.5) * 2;
  const top = lerp(stops[seg][0], stops[seg + 1][0], u), bot = lerp(stops[seg][1], stops[seg + 1][1], u);
  return [`rgb(${top})`, `rgb(${bot})`, k];
}
function render() {
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const [top, bot, night] = skyAt(camY);
  const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, top); sky.addColorStop(1, bot);
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  // stars once it gets dark
  if (night > 0.45) { g.fillStyle = `rgba(255,255,255,${(night - 0.45) * 1.6})`; for (let i = 0; i < 60; i++) { const sx = (i * 97.3) % W, sy = ((i * 53.1 + camY * 0.3) % H); g.fillRect(sx, sy, 2, 2); } }
  g.save();
  g.translate(0, camY + (WG - WG));
  // clouds drifting at mid heights
  for (let i = 0; i < 8; i++) {
    const cy = -400 - i * 520, cx = ((i * 211 + t * 12 * (i % 2 ? 1 : -1)) % (W + 300)) - 150;
    g.fillStyle = 'rgba(255,255,255,0.75)';
    g.beginPath(); g.ellipse(cx, cy, 70, 26, 0, 0, TAU); g.ellipse(cx + 50, cy - 12, 50, 24, 0, 0, TAU); g.ellipse(cx - 40, cy - 6, 40, 20, 0, 0, TAU); g.fill();
  }
  // far hills and trees near the ground
  g.fillStyle = '#a9d99a';
  g.beginPath(); g.moveTo(0, WG - 40);
  for (let x = 0; x <= W; x += 30) g.lineTo(x, WG - 60 - Math.sin(x * 0.01) * 24 - Math.sin(x * 0.027) * 10);
  g.lineTo(W, WG); g.lineTo(0, WG); g.closePath(); g.fill();
  for (const [x, s] of [[W * 0.1, 1], [W * 0.88, 1.2], [W * 0.22, 0.7]]) {
    g.fillStyle = '#7a5233'; g.fillRect(x - 6 * s, WG - 90 * s, 12 * s, 90 * s);
    g.fillStyle = '#6dbb7a'; g.beginPath(); g.arc(x, WG - 110 * s, 42 * s, 0, TAU); g.fill();
    g.fillStyle = '#ffa236'; for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(x + Math.cos(i * 2) * 24 * s, WG - 110 * s + Math.sin(i * 2) * 18 * s, 6 * s, 0, TAU); g.fill(); }
  }
  g.fillStyle = '#7cc56f'; g.fillRect(0, WG, W, H);
  g.fillStyle = '#6bb35f'; for (let x = 0; x < W; x += 18) { g.beginPath(); g.moveTo(x, WG + 2); g.lineTo(x + 4, WG - 8); g.lineTo(x + 8, WG + 2); g.fill(); }
  // height ruler on the left
  g.strokeStyle = 'rgba(43,51,48,0.25)'; g.fillStyle = 'rgba(43,51,48,0.45)'; g.font = '12px Gowun Dodum, sans-serif'; g.textAlign = 'left';
  const ht = headTopY();
  for (let cm = 50; cm < 2000; cm += 50) { const y = ht - cm * 4; if (y < -camY - 20 || y > H - camY) continue; g.beginPath(); g.moveTo(0, y); g.lineTo(cm % 100 ? 10 : 18, y); g.stroke(); if (cm % 100 === 0) g.fillText(`${cm / 100}m`, 22, y + 4); }
  // best-height flag
  if (save.bestHeight > 0) { const y = ht - save.bestHeight * 4; g.strokeStyle = '#ff6b7d'; g.setLineDash([8, 8]); g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); g.setLineDash([]); g.fillStyle = '#ff6b7d'; g.fillText('최고 기록', W - 70, y - 6); }
  drawCapy();
  // fruits
  for (const f of fruits) { const F = FRUITS[f.kind], b = f.body; if (f.fallen && f.fallT > 0.6) continue; g.globalAlpha = f.fallen ? 1 - f.fallT / 0.6 : 1; drawFruitShape(g, b.position.x, b.position.y, F.w, F.h, F, b.angle, f.squash); }
  g.globalAlpha = 1;
  if (freezeT > 0) for (const f of fruits) if (f.stacked) { g.strokeStyle = `rgba(200,240,255,${Math.min(1, freezeT)})`; g.lineWidth = 3; const b = f.body; g.strokeRect(b.bounds.min.x - 2, b.bounds.min.y - 2, b.bounds.max.x - b.bounds.min.x + 4, b.bounds.max.y - b.bounds.min.y + 4); }
  // branch with the swinging fruit
  if (state === 'play' || state === 'falling') {
    const by = branchY();
    g.strokeStyle = '#7a5233'; g.lineWidth = 12; g.lineCap = 'round';
    g.beginPath(); g.moveTo(-20, by - 30); g.quadraticCurveTo(W * 0.5, by - 10, W + 20, by - 40); g.stroke();
    g.fillStyle = '#6dbb7a'; for (let i = 0; i < 7; i++) { g.beginPath(); g.ellipse(i * W / 6, by - 34 - (i % 2) * 8, 26, 12, (i % 2 ? 0.4 : -0.4), 0, TAU); g.fill(); }
    if (holding) {
      const F = FRUITS[holding.kind], x = swing.x;
      g.strokeStyle = '#5a4632'; g.lineWidth = 2; g.beginPath(); g.moveTo(W / 2, by - 18); g.lineTo(x, by + 46 - F.h / 2); g.stroke();
      // a faint guide straight down
      g.strokeStyle = 'rgba(43,51,48,0.15)'; g.setLineDash([4, 8]); g.beginPath(); g.moveTo(x, by + 46 + F.h / 2); g.lineTo(x, towerTop() - 4); g.stroke(); g.setLineDash([]);
      drawFruitShape(g, x, by + 46, F.w, F.h, F, Math.cos(swing.phase) * 0.15);
    }
  }
  for (const p of parts) { g.globalAlpha = Math.max(0, 1 - p.age / p.life); g.fillStyle = p.c; if (p.leaf) { g.beginPath(); g.ellipse(p.x, p.y + (p.leaf ? 0 : 0), p.r * 2, p.r, p.age * 6, 0, TAU); g.fill(); } else { g.beginPath(); g.arc(p.x, p.y, p.r, 0, TAU); g.fill(); } }
  g.globalAlpha = 1;
  for (const x of texts) {
    const k = x.age / x.life, s = 1 + (k < 0.12 ? (0.12 - k) * 4 : 0);
    g.globalAlpha = Math.min(1, (1 - k) * 2);
    g.font = `${Math.round(x.size * s)}px Jua, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineWidth = 6; g.strokeStyle = x.color === '#fff' ? 'rgba(43,51,48,0.5)' : 'rgba(255,255,255,0.85)'; g.strokeText(x.text, x.x, x.y - k * 30);
    g.fillStyle = x.color; g.fillText(x.text, x.x, x.y - k * 30);
  }
  g.globalAlpha = 1;
  g.restore();
}
function drawCapy() {
  const x = head.position.x, top = head.position.y - HEAD_H / 2;
  const lean = (headTarget - headX) * 0.004;
  g.save(); g.translate(x, WG); g.rotate(clamp(lean, -0.12, 0.12));
  // shadow and feet
  g.fillStyle = 'rgba(0,0,0,0.12)'; g.beginPath(); g.ellipse(0, 4, 90, 12, 0, 0, TAU); g.fill();
  g.fillStyle = '#7a5233'; for (const fx of [-50, -20, 25, 55]) { g.beginPath(); g.ellipse(fx, -8, 14, 12, 0, 0, TAU); g.fill(); }
  // body facing the viewer
  g.fillStyle = '#b07a4f'; g.beginPath(); g.ellipse(0, -60, 92, 58, 0, 0, TAU); g.fill();
  // head: a broad flat top that carries the tower
  const hy = top - WG;
  g.beginPath(); g.roundRect ? g.roundRect(-70, hy - 4, 140, 92, 34) : g.rect(-70, hy - 4, 140, 92); g.fill();
  g.fillStyle = '#8f5f3c'; g.beginPath(); g.roundRect ? g.roundRect(-42, hy + 46, 84, 44, 20) : g.rect(-42, hy + 46, 84, 44); g.fill();
  g.fillStyle = '#7a5233'; for (const s of [-1, 1]) { g.beginPath(); g.ellipse(s * 62, hy + 6, 13, 10, 0, 0, TAU); g.fill(); }
  // nostrils
  g.fillStyle = '#3b2a1e'; for (const s of [-1, 1]) { g.beginPath(); g.ellipse(s * 12, hy + 60, 4, 6, 0, 0, TAU); g.fill(); }
  // eyes: calm while steady, wide open when the tower leans
  g.strokeStyle = '#2b2420'; g.fillStyle = '#2b2420'; g.lineWidth = 3.2; g.lineCap = 'round';
  for (const s of [-1, 1]) {
    if (sweat > 0.35) { g.beginPath(); g.arc(s * 34, hy + 30, 6, 0, TAU); g.fill(); g.fillStyle = '#fff'; g.beginPath(); g.arc(s * 34 + 2, hy + 28, 2, 0, TAU); g.fill(); g.fillStyle = '#2b2420'; }
    else { g.beginPath(); g.moveTo(s * 34 - 8, hy + 30); g.quadraticCurveTo(s * 34, hy + 24, s * 34 + 8, hy + 30); g.stroke(); }
  }
  g.fillStyle = 'rgba(255,140,150,0.45)'; for (const s of [-1, 1]) { g.beginPath(); g.ellipse(s * 50, hy + 44, 10, 6, 0, 0, TAU); g.fill(); }
  if (sweat > 0.5) { g.fillStyle = '#8fd0f0'; g.beginPath(); g.moveTo(58, hy + 14); g.quadraticCurveTo(66, hy + 28, 58, hy + 32); g.quadraticCurveTo(50, hy + 28, 58, hy + 14); g.fill(); }
  g.restore();
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  if (state === 'title') { t += dt; swing.phase += dt * 1.2; swing.x = W / 2 + Math.sin(swing.phase) * 100; }
  else update(dt);
  render();
  requestAnimationFrame(frame);
}
reset();
renderSound();
$('#startNote').textContent = save.plays ? `최고 ${save.bestCount}개 · 가장 높이 ${save.bestHeight}cm` : '스페이스바로 떨어뜨리고 방향키로 움직일 수도 있어요';
requestAnimationFrame(frame);
})();
</script>
