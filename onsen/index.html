<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="물길을 돌려 온천물을 카피바라 욕조까지 잇는 3D 힐링 퍼즐">
<style>[hidden]{display:none!important}</style>
<title>카피바라 온천 마을</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: full-screen 3D diorama; floating HUD on top, tool row at the bottom, overlays for title / stage list / clear sheet.
   One deliberate light look: a pastel morning sky over a floating onsen island. */
:root {
  --sky-top: #bfe6df;
  --sky-bot: #fde3cd;
  --ink: #27474d;
  --ink-soft: #5f7c80;
  --panel: #fffdf8;
  --panel-line: #eadfce;
  --yuzu: #ffa236;
  --yuzu-deep: #dd7a0e;
  --moss: #6cba86;
  --water: #5dc3d7;
  --blush: #ff9fb2;
  --locked: #cfd8d6;
  --f-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bot) 100%);
  color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
}
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--yuzu); outline-offset: 2px; }
#app { position: relative; height: 100%; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.round {
  width: 46px; height: 46px; border-radius: 50%; border: 0; display: grid; place-items: center;
  background: var(--panel); box-shadow: 0 3px 0 var(--panel-line), 0 8px 18px rgba(39, 71, 77, .12);
}
.round svg { width: 22px; height: 22px; stroke: var(--ink); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.round:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--panel-line); }

/* HUD */
.hud {
  position: absolute; left: 0; right: 0; top: 0; display: grid; grid-template-columns: auto 1fr auto; align-items: start; gap: 10px;
  padding: max(12px, env(safe-area-inset-top, 0px)) 16px 0;
  pointer-events: none;
}
.hud > * { pointer-events: auto; }
.stage-name { justify-self: center; text-align: center; min-width: 0; }
.stage-name b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 22px; line-height: 1.2; text-wrap: balance; }
.stage-name span { display: inline-block; margin-top: 4px; padding: 2px 12px; border-radius: 999px; background: rgba(255, 253, 248, .75); font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

.tip {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(max(14px, env(safe-area-inset-bottom, 0px)) + 66px);
  width: min(440px, calc(100% - 32px));
  display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center;
  padding: 10px 14px; border-radius: 18px; background: var(--panel); border: 0;
  box-shadow: 0 8px 22px rgba(39, 71, 77, .14); text-align: left; font-size: 14px;
}
.tip svg { width: 40px; height: 30px; }
.toast {
  position: absolute; left: 50%; top: calc(max(12px, env(safe-area-inset-top, 0px)) + 78px); transform: translateX(-50%);
  max-width: calc(100% - 32px); padding: 8px 16px; border-radius: 999px;
  background: var(--ink); color: var(--panel); font-size: 14px; text-align: center; box-shadow: 0 8px 20px rgba(39, 71, 77, .25);
  animation: pop .25s ease-out;
}
@keyframes pop { from { opacity: 0; transform: translate(-50%, -6px); } to { opacity: 1; transform: translate(-50%, 0); } }

.tools {
  position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 12px;
  padding: 0 16px max(14px, env(safe-area-inset-bottom, 0px));
  pointer-events: none;
}
.tools > * { pointer-events: auto; }
.pill-btn {
  height: 46px; padding: 0 18px; border-radius: 999px; border: 0; display: inline-flex; align-items: center; gap: 6px;
  background: var(--panel); font-family: var(--f-display); font-size: 16px;
  box-shadow: 0 3px 0 var(--panel-line), 0 8px 18px rgba(39, 71, 77, .12);
}
.pill-btn svg { width: 18px; height: 18px; stroke: var(--ink); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.pill-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--panel-line); }

/* overlays */
.overlay {
  position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr); place-items: end center; overflow: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px));
}
.card {
  width: min(460px, 100%); background: var(--panel); border-radius: 26px; padding: 22px 22px 20px;
  box-shadow: 0 6px 0 var(--panel-line), 0 20px 50px rgba(39, 71, 77, .18);
}
.title-card { text-align: center; }
.title-card h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(32px, 9vw, 44px); line-height: 1.1; text-wrap: balance; }
.title-card h1 em { font-style: normal; color: var(--yuzu-deep); }
.title-card p { margin: 8px auto 18px; color: var(--ink-soft); max-width: 30em; text-wrap: balance; }
.btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.primary {
  border: 0; border-radius: 18px; padding: 12px 22px; min-width: 140px;
  background: var(--yuzu); color: #fff; font-family: var(--f-display); font-size: 19px;
  box-shadow: 0 4px 0 var(--yuzu-deep);
}
.primary:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--yuzu-deep); }
.secondary {
  border: 2px solid var(--panel-line); border-radius: 18px; padding: 10px 20px; min-width: 120px;
  background: var(--panel); font-family: var(--f-display); font-size: 18px;
}
.progress-note { margin-top: 14px; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

#select { place-items: center; background: rgba(191, 230, 223, .55); }
.select-card { width: min(620px, 100%); min-width: 0; }
.select-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.select-head h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 26px; }
.chapters { position: relative; display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 10px; margin: 0 -4px 6px; scroll-snap-type: x proximity; }
.chapters button {
  flex: none; scroll-snap-align: center; display: grid; grid-template-columns: auto auto; column-gap: 6px; align-items: baseline; text-align: left;
  border: 2px solid var(--panel-line); border-radius: 14px; background: #fff; padding: 6px 12px 5px;
}
.chapters button b { font-family: var(--f-display); font-weight: 400; font-size: 18px; color: var(--moss); grid-row: span 2; }
.chapters button span { font-size: 13px; white-space: nowrap; }
.chapters button small { font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.chapters button[aria-selected="true"] { border-color: var(--yuzu); background: #fff7ea; }
.chapters button:disabled { cursor: not-allowed; opacity: .5; }
.stages { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.stage {
  border: 2px solid var(--panel-line); border-radius: 18px; background: #fff; padding: 10px 8px 9px; text-align: center;
  display: grid; gap: 2px; justify-items: center;
}
.stage .num { font-family: var(--f-display); font-size: 26px; line-height: 1; color: var(--moss); }
.stage .nm { font-size: 12px; line-height: 1.3; min-height: 2.6em; display: grid; place-items: center; text-wrap: balance; }
.stage.cleared { border-color: var(--moss); }
.stage.next { border-color: var(--yuzu); box-shadow: 0 0 0 3px rgba(255, 162, 54, .25); }
.stage:disabled { cursor: not-allowed; background: #f6f4ef; }
.stage:disabled .num { color: var(--locked); }
.stage:disabled .nm { color: var(--locked); }
.flowers { display: flex; gap: 2px; height: 16px; align-items: center; }
.flowers svg { width: 15px; height: 15px; }
.f-on { fill: var(--blush); } .f-off { fill: var(--locked); } .f-mid { fill: var(--yuzu); }
.yz { fill: var(--yuzu); } .yz-leaf { fill: var(--moss); }

/* clear sheet */
#clear { background: linear-gradient(180deg, transparent 40%, rgba(253, 227, 205, .6)); }
.clear-card { text-align: center; animation: rise .45s cubic-bezier(.2, .9, .3, 1.2); }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.clear-card h2 { margin: 0 0 4px; font-family: var(--f-display); font-weight: 400; font-size: 28px; text-wrap: balance; }
.clear-card .big-flowers { display: flex; justify-content: center; gap: 8px; margin: 10px 0 6px; }
.clear-card .big-flowers svg { width: 44px; height: 44px; }
.clear-card .big-flowers svg.f-on-anim { animation: bloom .5s ease-out both; }
@keyframes bloom { from { transform: scale(.2) rotate(-40deg); } to { transform: none; } }
.stats { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 6px 0 16px; }
.stats span { padding: 4px 12px; border-radius: 999px; background: #f3efe6; font-size: 14px; font-variant-numeric: tabular-nums; }

.hud-right { display: flex; gap: 8px; }
.goals { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 6px; margin-top: 6px; }
.goal {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px 2px 7px; border-radius: 999px;
  background: rgba(255, 253, 248, .88); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.goal svg { width: 16px; height: 16px; }
.goal .dot { width: 10px; height: 10px; border-radius: 50%; }
.goal.done { background: var(--moss); color: #fff; }
.goal.warn { background: var(--ink); color: var(--panel); }
.goal.soft { opacity: .8; }
.guide-step { font-family: var(--f-display); font-weight: 400; color: var(--yuzu-deep); margin-right: 6px; }
.overlay.center { place-items: center; background: rgba(191, 230, 223, .55); }
.intro-card { text-align: center; width: min(380px, 100%); }
.intro-tag { display: inline-block; padding: 2px 12px; border-radius: 999px; background: var(--yuzu); color: #fff; font-family: var(--f-display); font-size: 14px; }
.gim-art { display: block; width: 112px; height: 112px; margin: 12px auto 6px; }
.intro-card h2 { margin: 0 0 6px; font-family: var(--f-display); font-weight: 400; font-size: 26px; }
.intro-card p { margin: 0 auto 18px; color: var(--ink-soft); max-width: 26em; text-wrap: pretty; }
.dex-list { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); max-height: min(62vh, 560px); overflow: auto; padding: 2px; }
.dex-item {
  display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; align-items: center; text-align: left;
  background: #fff; border: 2px solid var(--panel-line); border-radius: 16px; padding: 8px 10px;
}
.dex-item svg { width: 52px; height: 52px; }
.dex-item b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 16px; }
.dex-item small { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 12px; color: var(--ink-soft); line-height: 1.4; }
.dex-item.locked { cursor: default; background: #f6f4ef; }
.village-gim { margin: -2px 0 10px; font-size: 13px; color: var(--ink-soft); }
.clear-next { margin: -6px 0 14px; font-size: 14px; color: var(--yuzu-deep); text-wrap: balance; }
@media (max-width: 480px) {
  .hud-right { flex-direction: column; gap: 6px; }
  .goal { font-size: 12px; padding: 1px 8px 1px 6px; }

  .hud { padding-inline: 12px; gap: 6px; }
  .round { width: 42px; height: 42px; }
  .stage-name b { font-size: 18px; }
  .tools { gap: 8px; }
  .pill-btn { padding: 0 14px; font-size: 15px; }
  .card { padding: 18px 16px 16px; border-radius: 22px; }
  .stages { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .stage .num { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="flower" viewBox="0 0 20 20">
    <circle cx="10" cy="4.6" r="3.9"/><circle cx="15.1" cy="8.3" r="3.9"/><circle cx="13.2" cy="14.3" r="3.9"/>
    <circle cx="6.8" cy="14.3" r="3.9"/><circle cx="4.9" cy="8.3" r="3.9"/><circle cx="10" cy="10" r="3" fill="#fff6d8"/>
  </symbol>
  <symbol id="yuzu" viewBox="0 0 20 20">
    <circle cx="10" cy="11.5" r="7.5" class="yz"/><ellipse cx="13" cy="4" rx="3.6" ry="1.8" transform="rotate(-28 13 4)" class="yz-leaf"/>
  </symbol>
  <symbol id="capy" viewBox="0 0 40 30">
    <rect x="11" y="11" width="27" height="16" rx="8" fill="#b07a4f"/><rect x="2" y="8" width="20" height="17" rx="7" fill="#b07a4f"/>
    <rect x="1" y="15" width="11" height="10" rx="4.5" fill="#7a5233"/><circle cx="12" cy="6" r="5" fill="#ffa236"/>
    <path d="M13 14 q2.4 -2 4.8 0" stroke="#27474d" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </symbol>
</svg>

<div id="app">
  <canvas id="scene" aria-label="온천 섬 디오라마. 물길을 눌러 돌리고, 끌어서 섬을 돌릴 수 있어요."></canvas>

  <header class="hud" id="hud" hidden>
    <button type="button" class="round" id="toSelect" aria-label="스테이지 목록">
      <svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h14"/></svg>
    </button>
    <div class="stage-name"><b id="stageTitle"></b><span id="moveLabel"></span><div class="goals" id="goals" aria-live="polite"></div></div>
    <div class="hud-right">
      <button type="button" class="round" id="helpBtn" aria-label="물길 도감"><svg viewBox="0 0 24 24"><path d="M9.2 9a3 3 0 1 1 4.3 2.7c-.9.5-1.5 1.2-1.5 2.3v.5"/><path d="M12 18h.01"/></svg></button>
      <button type="button" class="round" id="soundBtn" aria-label="소리 끄기">
        <svg viewBox="0 0 24 24" id="soundIcon"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      </button>
    </div>
  </header>

  <button type="button" class="tip" id="tip" hidden><svg viewBox="0 0 40 30" aria-hidden="true"><use href="#capy"/></svg><span><b class="guide-step" id="tipStep" hidden></b><span id="tipText"></span></span></button>
  <div class="toast" id="toast" role="status" hidden></div>

  <nav class="tools" id="tools" hidden aria-label="게임 도구">
    <button type="button" class="round" id="viewL" aria-label="섬을 왼쪽으로 돌리기"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg></button>
    <button type="button" class="pill-btn" id="hintBtn"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z"/></svg>힌트</button>
    <button type="button" class="pill-btn" id="resetBtn"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>처음부터</button>
    <button type="button" class="round" id="viewR" aria-label="섬을 오른쪽으로 돌리기"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4h-4"/></svg></button>
  </nav>

  <section class="overlay" id="title">
    <div class="card title-card">
      <h1>카피바라 <em>온천 마을</em></h1>
      <p>원천에서 솟은 따끈한 온천물을 욕조까지 이어 주세요. 물길을 눌러 돌리고, 섬을 끌어서 돌려 볼 수 있어요.</p>
      <div class="btn-row">
        <button type="button" class="primary" id="playBtn">시작하기</button>
        <button type="button" class="secondary" id="stagesBtn">스테이지</button>
      </div>
      <div class="progress-note" id="progressNote"></div>
    </div>
  </section>

  <section class="overlay" id="select" hidden>
    <div class="card select-card" role="dialog" aria-labelledby="selectTitle">
      <div class="select-head">
        <h2 id="selectTitle">온천 고르기</h2>
        <button type="button" class="round" id="closeSelect" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="chapters" id="chapters" role="tablist" aria-label="마을"></div>
      <p class="village-gim" id="villageGim"></p>
      <div class="stages" id="stages"></div>
      <div class="progress-note" id="selectNote"></div>
    </div>
  </section>

  <section class="overlay center" id="intro" hidden>
    <div class="card intro-card" role="dialog" aria-labelledby="introTitle">
      <span class="intro-tag" id="introTag"></span>
      <svg class="gim-art" id="introArt" viewBox="0 0 64 64" aria-hidden="true"></svg>
      <h2 id="introTitle"></h2>
      <p id="introText"></p>
      <button type="button" class="primary" id="introGo">해볼게요</button>
    </div>
  </section>

  <section class="overlay center" id="dex" hidden>
    <div class="card select-card" role="dialog" aria-labelledby="dexTitle">
      <div class="select-head">
        <h2 id="dexTitle">물길 도감</h2>
        <button type="button" class="round" id="closeDex" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="dex-list" id="dexList"></div>
    </div>
  </section>

  <section class="overlay" id="clear" hidden>
    <div class="card clear-card" role="dialog" aria-labelledby="clearTitle">
      <h2 id="clearTitle"></h2>
      <div class="big-flowers" id="bigFlowers"></div>
      <div class="stats" id="clearStats"></div>
      <p class="clear-next" id="clearNext" hidden></p>
      <div class="btn-row">
        <button type="button" class="secondary" id="againBtn">다시 하기</button>
        <button type="button" class="primary" id="nextBtn">다음 온천</button>
      </div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(() => {
'use strict';
// LOGIC START
const N = 1, E = 2, S = 4, W = 8;
const DIRS = [[0, -1, N, S], [1, 0, E, W], [0, 1, S, N], [-1, 0, W, E]];   // dx, dz, bit, opposite bit
const BOX = { '─': E|W, '│': N|S, '┌': E|S, '┐': S|W, '└': N|E, '┘': N|W, '├': N|E|S, '┤': N|S|W, '┬': E|S|W, '┴': N|E|W, '┼': N|E|S|W };
const rotCW = m => ((m << 1) | (m >> 3)) & 15;
const rotBy = (m, k) => { for (let i = 0; i < ((k % 4) + 4) % 4; i++) m = rotCW(m); return m; };

// Tiles: S/Q spring (Q = second colour), T tub, A/B tub that wants spring S/Q water, C cat, . grass, box chars = pipes.
// Extras by [x, z]: fixed, yuzu, gate, scale, links [[a, b]], leaves, ice, lift [x, z, otherHeight], cloud.
// intro: gimmick card shown the first time; guide: coach steps { at: [x, z], until: wet|clear|thaw|height|sol, text }.
const LEVELS = [
  { name: '첫 온천', intro: 'goal',
    tiles: ['S─┐', '..│', '..T'], heights: ['222', '111', '000'],
    guide: [{ at: [2, 2], until: 'wet', text: '반짝이는 물길을 눌러 돌려요. 원천에서 욕조까지 물길을 이어 주세요.' }] },
  { name: '갈림길', tip: '갈림길 하나로 두 마리 모두에게 물을 나눠 줄 수 있어요.',
    tiles: ['..S..', '..│..', '┌─┴─┐', '│...│', 'T...T'], heights: ['33333', '22222', '22222', '11111', '00000'] },
  { name: '물은 아래로', intro: 'height', tip: '물은 높은 곳으로 올라가지 못해요. 섬을 돌려 높이를 살펴보세요.',

function parseLevel(L) {
  const H = L.tiles.length, Wd = [...L.tiles[0]].length;
  const cells = [];
  for (let z = 0; z < H; z++) {
    const row = [...L.tiles[z]];
    if (row.length !== Wd || L.heights[z].length !== Wd) throw new Error(`${L.name}: row ${z} width mismatch`);
    for (let x = 0; x < Wd; x++) {
      const ch = row[x], h = +L.heights[z][x];
      const c = { x, z, h, hSol: h, kind: 'empty', sol: 0, mask: 0, k: 0 };
      if (ch === 'S' || ch === 'Q') { c.kind = 'src'; c.color = ch === 'Q' ? 'b' : 'a'; }
      else if (ch === 'T' || ch === 'A' || ch === 'B') { c.kind = 'tub'; c.want = ch === 'A' ? 'a' : ch === 'B' ? 'b' : null; }
      else if (ch === 'C') c.kind = 'cat';
      else if (BOX[ch] !== undefined) { c.kind = 'pipe'; c.sol = c.mask = BOX[ch]; }
      else if (ch !== '.') throw new Error(`${L.name}: unknown tile ${ch}`);
      cells.push(c);
    }
  }
  const at = (x, z) => (x >= 0 && z >= 0 && x < Wd && z < H ? cells[z * Wd + x] : null);
  const pipeAt = (x, z, what) => { const c = at(x, z); if (!c || c.kind !== 'pipe') throw new Error(`${L.name}: ${what} ${x},${z} is not a pipe`); return c; };
  for (const [x, z] of L.fixed || []) pipeAt(x, z, 'fixed').fixed = true;
  for (const [x, z] of L.yuzu || []) pipeAt(x, z, 'yuzu').yuzu = true;
  for (const [x, z] of L.gate || []) { const c = pipeAt(x, z, 'gate'); c.gate = true; c.fixed = true; }
  for (const [x, z] of L.scale || []) pipeAt(x, z, 'scale').scale = true;
  for (const [x, z] of L.leaves || []) pipeAt(x, z, 'leaves').leaf = true;
  for (const [x, z] of L.ice || []) pipeAt(x, z, 'ice').ice = true;
  for (const [x, z] of L.cloud || []) pipeAt(x, z, 'cloud').cloud = true;
  for (const [x, z, alt] of L.lift || []) { const c = pipeAt(x, z, 'lift'); c.lift = true; c.fixed = true; c.hAlt = alt; }
  (L.links || []).forEach((pair, id) => pair.forEach(([x, z]) => { const c = pipeAt(x, z, 'link'); if (c.fixed) throw new Error(`${L.name}: linked pipe is fixed`); c.link = id; }));
  const srcs = cells.filter(c => c.kind === 'src');
  if (!srcs.length) throw new Error(`${L.name}: no spring`);
  for (const s of srcs) for (const [dx, dz, bit, opp] of DIRS) {
    const n = at(s.x + dx, s.z + dz);
    if (n && n.kind === 'pipe' && n.sol & opp) s.sol = s.mask |= bit;
  }
  const colored = srcs.some(s => s.color === 'b');
  const lv = { name: L.name, W: Wd, H, cells, at, srcs, colored, guide: L.guide || null };
  resetState(lv);
  return lv;
}

// solved arrangement with every gimmick in its starting state (ice frozen, leaves on, lifts where they belong)
function resetState(lv) {
  for (const c of lv.cells) { c.mask = c.sol; c.k = 0; c.h = c.hSol; c.leafOn = !!c.leaf; c.iceOn = !!c.ice; }
}
const passable = (c, gateOpen) => c.kind === 'pipe' && !c.leafOn && !c.iceOn && (!c.gate || gateOpen);

function flowOnce(lv, gateOpen) {
  const wet = new Map(), links = [], touches = new Set();
  for (const s of lv.srcs) {
    const color = s.color;
    const mark = c => { if (!wet.has(c)) wet.set(c, new Set()); const had = wet.get(c).has(color); wet.get(c).add(color); return !had; };
    mark(s);
    const queue = [s];
    while (queue.length) {
      const c = queue.shift();
      for (const [dx, dz, bit, opp] of DIRS) {
        if (!(c.mask & bit)) continue;
        const n = lv.at(c.x + dx, c.z + dz);
        if (!n) continue;
        const reach = n.h <= c.h || c.cloud;          // water never climbs, except out of a cloud
        if (!reach) continue;
        touches.add(n);
        const accepts = n.kind === 'tub' || n.kind === 'cat' || (n.kind === 'pipe' && passable(n, gateOpen) && n.mask & opp);
        if (!accepts) continue;
        links.push({ a: c, b: n, bit, color });
        if (mark(n) && n.kind === 'pipe') queue.push(n);
      }
    }
  }
  return { wet, links, touches };
}

function flow(lv) {
  const scales = lv.cells.filter(c => c.scale);
  let r = flowOnce(lv, false), gateOpen = false;
  if (scales.length && scales.every(c => r.wet.has(c))) { gateOpen = true; r = flowOnce(lv, true); }
  const tubs = lv.cells.filter(c => c.kind === 'tub');
  const happy = t => { const w = r.wet.get(t); if (!w) return false; return t.want ? w.size === 1 && w.has(t.want) : (!lv.colored || w.size === 1); };
  const filled = tubs.filter(happy);
  return {
    ...r, gateOpen, tubs, filled,
    mixed: tubs.filter(t => r.wet.has(t) && !happy(t)),
    wetCats: lv.cells.filter(c => c.kind === 'cat' && r.wet.has(c)),
    yuzu: lv.cells.filter(c => c.yuzu && r.wet.has(c)),
    solved: filled.length === tubs.length && !lv.cells.some(c => c.kind === 'cat' && r.wet.has(c)),
  };
}

// thaw any ice the water has reached, until nothing changes; returns the final flow and what melted
function settle(lv) {
  const thawed = [];
  for (;;) {
    const f = flow(lv);
    const melt = lv.cells.filter(c => c.iceOn && f.touches.has(c));
    if (!melt.length) return { f, thawed };
    for (const c of melt) { c.iceOn = false; thawed.push(c); }
  }
}

function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const rotatable = c => c.kind === 'pipe' && !c.fixed && c.sol !== 15;
// tiles that turn together: a link group, or a single pipe
function units(lv) {
  const groups = new Map(), out = [];
  for (const c of lv.cells) {
    if (!rotatable(c)) continue;
    if (c.link === undefined) out.push([c]);
    else { if (!groups.has(c.link)) { groups.set(c.link, []); out.push(groups.get(c.link)); } groups.get(c.link).push(c); }
  }
  return out;
}
function stepsTo(unit) { for (let k = 0; k < 4; k++) if (unit.every(c => rotBy(c.mask, k) === c.sol)) return k; return 0; }

// same scramble every time for a stage, so records stay comparable; returns par (taps for the intended solution)
function scramble(lv, index) {
  const us = units(lv);
  for (let seed = index * 7919 + 17; seed < index * 7919 + 17 + 5000; seed++) {
    const rnd = mulberry32(seed);
    resetState(lv);
    for (const u of us) {
      let k = Math.floor(rnd() * 4);
      // ice and leaves only mean something if the tile underneath also needs turning
      if (u.some(c => c.ice || c.leaf)) while (rotBy(u[0].sol, k) === u[0].sol) k = (k + 1) % 4;
      for (const c of u) { c.k = k; c.mask = rotBy(c.sol, k); }
    }
    for (const c of lv.cells) if (c.lift) c.h = c.hAlt;
    const par = us.reduce((s, u) => s + stepsTo(u), 0) + lv.cells.filter(c => c.leaf).length + lv.cells.filter(c => c.lift).length;
    const solvedAtStart = settle(lv).f.solved;
    for (const c of lv.cells) c.iceOn = !!c.ice;          // settle may have thawed; the player starts frozen
    if (!solvedAtStart && par >= Math.min(3, us.length)) return par;
  }
  throw new Error(`${lv.name}: no scramble leaves the stage unsolved`);
}

// the intended route from a spring to a target, used by the coach and by hints
function solutionPath(lv, target) {
  const prev = new Map(), q = [];
  for (const s of lv.srcs) { prev.set(s, null); q.push(s); }
  while (q.length) {
    const c = q.shift();
    if (c === target) break;
    for (const [dx, dz, bit, opp] of DIRS) {
      if (!(c.sol & bit)) continue;
      const n = lv.at(c.x + dx, c.z + dz);
      if (!n || prev.has(n)) continue;
      if (!(n.kind === 'tub' || n.kind === 'cat' || (n.kind === 'pipe' && n.sol & opp))) continue;
      if (n.kind === 'tub' && n.want && n.want !== srcColorOf(lv, c, prev)) continue;
      prev.set(n, c); if (n.kind === 'pipe') q.push(n); else if (n === target) { q.length = 0; break; }
    }
  }
  if (!prev.has(target)) return [];
  const path = [];
  for (let c = target; c; c = prev.get(c)) path.unshift(c);
  return path;
}
function srcColorOf(lv, c, prev) { while (prev.get(c)) c = prev.get(c); return c.color; }

function needsWork(c) {
  if (c.kind !== 'pipe') return null;
  if (c.leafOn) return 'clear';
  if (c.lift && c.h !== c.hSol) return 'height';
  if (c.iceOn && c.mask !== c.sol) return 'thaw';
  if (rotatable(c) && c.mask !== c.sol) return 'sol';
  return null;
}

function makeCat() {

  const furM = M(COLORS.cat), darkM = M(COLORS.catDark), ink = M(COLORS.ink);
  const cushion = cyl(0.3, 0.32, 0.07, M(COLORS.cushion), 20); cushion.position.y = 0.035; g.add(cushion);
  const cat = new THREE.Group(); g.add(cat); g.userData.cat = cat;
  const body = sph(0.5, furM); body.scale.set(0.4, 0.24, 0.32); body.position.set(0, 0.17, 0); cat.add(body);
  const head = sph(0.12, furM); head.position.set(0.15, 0.24, 0.06); cat.add(head);
  for (const s of [-1, 1]) {
    const ear = mesh(new THREE.ConeGeometry(0.045, 0.08, 4), darkM); ear.position.set(0.15, 0.36, 0.06 + s * 0.065); cat.add(ear);
    const eye = box(0.012, 0.012, 0.04, ink, { cast: false }); eye.position.set(0.255, 0.26, 0.06 + s * 0.045); cat.add(eye);
  }
  const tail = mesh(new THREE.TorusGeometry(0.17, 0.035, 8, 20, Math.PI * 1.1), darkM); tail.rotation.x = Math.PI / 2; tail.position.set(-0.02, 0.1, 0); cat.add(tail);
  const stripe = box(0.06, 0.02, 0.2, darkM); stripe.position.set(-0.05, 0.285, 0); cat.add(stripe);
  const alert = new THREE.Sprite(new THREE.SpriteMaterial({ map: alertTex, depthTest: false }));
  alert.scale.set(0.34, 0.34, 1); alert.position.set(0.05, 0.7, 0); alert.visible = false; g.add(alert);
  g.userData.alert = alert;
  return g;
}

function makeTree(rnd, th) {
  const g = new THREE.Group();
  const [c1, c2] = th.tree;
  if (th.kind === 'bamboo') {
    for (let i = 0; i < 3; i++) {
      const hgt = 0.5 + rnd() * 0.35;
      const stalk = cyl(0.03, 0.035, hgt, M(i % 2 ? c1 : c2), 8); stalk.position.set((rnd() - 0.5) * 0.25, hgt / 2, (rnd() - 0.5) * 0.25); g.add(stalk);
      const leaf = sph(0.5, M(c1)); leaf.scale.set(0.16, 0.05, 0.08); leaf.position.set(stalk.position.x + 0.06, hgt * 0.85, stalk.position.z); leaf.rotation.z = -0.4; g.add(leaf);
    }
    return g;
  }
  const trunk = cyl(0.04, 0.06, 0.24, M(COLORS.trunk), 8); trunk.position.y = 0.12; g.add(trunk);
  const pine = th.kind === 'pine' || th.kind === 'snow' || (th.kind === 'mixed' && rnd() < 0.5);
  if (!pine) {
    const a = sph(0.2, M(c1)); a.position.y = 0.34; g.add(a);
    const b = sph(0.14, M(c2)); b.position.set(0.08, 0.5, 0.04); g.add(b);
  } else {
    const a = mesh(new THREE.ConeGeometry(0.2, 0.34, 8), M(c2)); a.position.y = 0.36; g.add(a);
    const b = mesh(new THREE.ConeGeometry(0.15, 0.26, 8), M(th.kind === 'snow' ? COLORS.white : c1)); b.position.y = 0.54; g.add(b);
  }
  if (th.kind === 'yuzu' || rnd() < 0.25) { // a yuzu tree
    for (let i = 0; i < 3; i++) { const y = sph(0.035, M(COLORS.yuzu), { cast: false }); y.position.set(Math.cos(i * 2.1) * 0.16, 0.32 + i * 0.04, Math.sin(i * 2.1) * 0.16); g.add(y); }
  }
  return g;
}
function makeFlowers(rnd) {
  const g = new THREE.Group();
  const cols = [COLORS.pink, COLORS.white, COLORS.yuzu];
  for (let i = 0; i < 5; i++) {
    const f = sph(0.04, M(cols[Math.floor(rnd() * cols.length)]), { cast: false });
    f.position.set((rnd() - 0.5) * 0.6, 0.04, (rnd() - 0.5) * 0.6); g.add(f);
  }
  return g;
}
function makeMushroom() {
  const g = new THREE.Group();
  const st = cyl(0.03, 0.035, 0.08, M(COLORS.white), 8); st.position.y = 0.04; g.add(st);
  const cap = mesh(new THREE.SphereGeometry(0.07, 12, 8, 0, TAU, 0, Math.PI / 2), M(COLORS.cap)); cap.position.y = 0.08; g.add(cap);
  return g;
}

// trough of wood (rotatable) or stone (fixed); arms follow the solved mask, the group rotates to the current one
function makeTrough(mask, stone) {
  const g = new THREE.Group();
  const m = M(stone ? COLORS.stone : COLORS.wood), inner = M(stone ? COLORS.stoneDark : COLORS.woodDark);
  const water = [];
  const hub = box(0.44, 0.16, 0.44, m); hub.position.y = 0.08; g.add(hub);
  const hubIn = box(0.24, 0.02, 0.24, inner, { cast: false }); hubIn.position.y = 0.161; g.add(hubIn);
  const hubW = box(0.24, 0.05, 0.24, M(COLORS.water), { cast: false }); hubW.position.y = 0.17; water.push(hubW); g.add(hubW);
  DIRS.forEach(([dx, dz, bit]) => {
    if (!(mask & bit)) return;
    const along = dx !== 0;
    const arm = box(along ? 0.5 : 0.44, 0.16, along ? 0.44 : 0.5, m); arm.position.set(dx * 0.25, 0.08, dz * 0.25); g.add(arm);
    const armIn = box(along ? 0.5 : 0.24, 0.02, along ? 0.24 : 0.5, inner, { cast: false }); armIn.position.set(dx * 0.26, 0.161, dz * 0.26); g.add(armIn);
    const w = box(along ? 0.52 : 0.24, 0.05, along ? 0.24 : 0.52, M(COLORS.water), { cast: false }); w.position.set(dx * 0.26, 0.17, dz * 0.26); water.push(w); g.add(w);
  });
  return { g, water };
}

// ---------- gimmick models ----------
const LINK_COLORS = [0xff8fb1, 0xa98bff, 0x4fc3b0];
const WATER = { plain: 0x63c9dc, a: 0xffb547, b: 0x8fd46f, mixed: 0xb3a27e };
const iceMat = new THREE.MeshPhongMaterial({ color: 0xd6f2ff, transparent: true, opacity: 0.62, shininess: 120, specular: 0xffffff });
function makeFlag(color) {
  const g = new THREE.Group();
  const pole = cyl(0.015, 0.015, 0.5, M(COLORS.stoneDark), 6); pole.position.y = 0.25; g.add(pole);
  const cloth = mesh(new THREE.ConeGeometry(0.09, 0.2, 3), M(color)); cloth.rotation.z = -Math.PI / 2; cloth.position.set(0.1, 0.43, 0); g.add(cloth);
  return g;
}
function makeScale() {
  const g = new THREE.Group();
  const post = cyl(0.03, 0.04, 0.22, M(COLORS.woodDark), 8); post.position.y = 0.11; g.add(post);
  const plate = cyl(0.13, 0.11, 0.03, M(COLORS.wood), 14); plate.position.y = 0.23; g.add(plate);
  const y = sph(0.09, M(COLORS.yuzu)); y.position.y = 0.32; g.add(y);
  const leaf = sph(0.5, M(COLORS.leaf)); leaf.scale.set(0.08, 0.02, 0.04); leaf.position.set(0.03, 0.41, 0); g.add(leaf);
  g.userData.fruit = y;
  return g;
}
function makeLeafPile(rnd) {
  const g = new THREE.Group(), cols = [0xe9824a, 0xd9603b, 0xf2b33d, 0xc9573a];
  for (let i = 0; i < 11; i++) {
    const l = sph(0.5, M(cols[i % cols.length]), { cast: true });
    l.scale.set(0.2, 0.05, 0.12);
    l.position.set((rnd() - 0.5) * 0.6, 0.12 + rnd() * 0.12, (rnd() - 0.5) * 0.6);
    l.rotation.set(rnd() * 0.5, rnd() * TAU, rnd() * 0.5);
    g.add(l);
  }
  return g;
}
function makeCloudRing() {
  const g = new THREE.Group();
  for (let i = 0; i < 7; i++) {
    const a = i / 7 * TAU;
    const p = sph(0.11 + (i % 2) * 0.03, M(COLORS.cloud), { cast: false });
    p.position.set(Math.cos(a) * 0.4, 0.16 + (i % 3) * 0.03, Math.sin(a) * 0.4);
    g.add(p);
  }
  return g;
}
function makeLiftArrows() {
  const g = new THREE.Group();
  for (const [dx, up] of [[-0.36, true], [0.36, false]]) {
    const c = mesh(new THREE.ConeGeometry(0.06, 0.12, 4), M(up ? 0x6b55b8 : 0xffffff), { cast: false });
    c.position.set(dx, 0.08, 0.36); if (!up) c.rotation.z = Math.PI; g.add(c);
  }
  return g;
}

// ---------- level build ----------
let lv = null, levelIndex = 0, moves = 0, par = 0, mode = 'title';
let levelObjs = [], hitboxes = [], falls = [], steamEmitters = [], particles = [];
let clearTimer = 0, lastFlow = null, guideIdx = 0, highlight = null;
const view = { rot: 0, target: 0 };
const ring = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.045, 8, 40), new THREE.MeshBasicMaterial({ color: 0xffc83d, transparent: true, opacity: 0.95, depthTest: false }));
ring.rotation.x = Math.PI / 2; ring.renderOrder = 10; ring.visible = false;
pivot.add(ring);

function clearScene() {
  for (const o of levelObjs) pivot.remove(o);
  for (const f of falls) pivot.remove(f.mesh);
  levelObjs = []; hitboxes = []; falls = []; steamEmitters = []; particles.forEach(p => pivot.remove(p.sprite)); particles = [];
}
function add(o) { pivot.add(o); levelObjs.push(o); return o; }
const cellY = c => c.liftG ? c.liftG.position.y : 0;

function buildLevel(i, showcase) {
  clearScene();
  levelIndex = i;
  lv = parseLevel(LEVELS[i]);
  if (showcase) { resetState(lv); for (const c of lv.cells) { c.leafOn = false; c.iceOn = false; } par = 0; }
  else par = scramble(lv, i);
  moves = 0; lv.done = false; lv.gateOpen = false; guideIdx = 0; highlight = null;
  const ox = -(lv.W - 1) / 2, oz = -(lv.H - 1) / 2;
  const rnd = mulberry32(i * 131 + 5);
  const th = CHAPTERS[chapterOf(i)];
  document.documentElement.style.setProperty('--sky-top', th.sky[0]);
  document.documentElement.style.setProperty('--sky-bot', th.sky[1]);
  const maxH = Math.max(...lv.cells.map(c => Math.max(c.hSol, c.hAlt || 0)));

  // floating island base
  const base = box(lv.W + 0.24, 0.9, lv.H + 0.24, M(COLORS.rock)); base.position.y = -0.82; add(base);
  const under = mesh(new THREE.ConeGeometry(Math.min(lv.W, lv.H) * 0.5, 1.8, 7), M(COLORS.rock)); under.rotation.x = Math.PI; under.position.y = -2.15; add(under);
  for (let k = 0; k < 5; k++) {
    const cl = new THREE.Group();
    for (let j = 0; j < 3; j++) { const p = sph(0.3 + rnd() * 0.25, M(COLORS.cloud), { cast: false, receive: false }); p.position.set(j * 0.4, rnd() * 0.15, rnd() * 0.2); cl.add(p); }
    const a = rnd() * TAU, r = Math.max(lv.W, lv.H) * 0.75 + 1 + rnd() * 1.5;
    cl.position.set(Math.cos(a) * r, -1.8 + rnd() * 1.2, Math.sin(a) * r);
    cl.userData.drift = 0.05 + rnd() * 0.08;
    add(cl);
  }

  for (const c of lv.cells) {
    const px = c.x + ox, pz = c.z + oz, ty = c.hSol * STEP_H;
    c.pos = new THREE.Vector3(px, ty, pz);
    c.wet = 0; c.wetTarget = 0; c.wetDelay = 0; c.waterMeshes = []; c.happyTarget = 0;
    let holder = null;
    if (c.lift) { holder = new THREE.Group(); holder.position.y = (c.h - c.hSol) * STEP_H; add(holder); c.liftG = holder; }
    const put = o => (holder ? holder.add(o) : add(o));
    const colH = 1.1 + ty + (c.lift ? 0.9 : 0);
    const col = box(1, colH, 1, M(COLORS.dirt)); col.position.set(px, ty - colH / 2 - 0.06, pz); put(col);
    const cap = box(1, 0.12, 1, M(c.lift ? 0xc9b8f0 : th.grass[(c.x + c.z) % 2])); cap.position.set(px, ty - 0.06, pz); put(cap);

    if (c.kind === 'pipe' || c.kind === 'src') {
      const t = makeTrough(c.sol, c.fixed || c.kind === 'src');
      const wm = waterMat(); t.water.forEach(w => { w.material = wm; w.visible = false; });
      c.waterMat = wm; c.waterMeshes = t.water;
      t.g.position.copy(c.pos); t.g.rotation.y = -c.k * Math.PI / 2;
      c.group = t.g; c.rotY = t.g.rotation.y; put(t.g);
      if (c.kind === 'src') {
        const ringM = mesh(new THREE.CylinderGeometry(0.36, 0.42, 0.3, 18, 1, true), new THREE.MeshLambertMaterial({ color: COLORS.stoneDark, side: THREE.DoubleSide })); ringM.position.set(px, ty + 0.15, pz); add(ringM);
        const rim = mesh(new THREE.TorusGeometry(0.36, 0.05, 8, 24), M(lv.colored ? WATER[c.color] : COLORS.stone)); rim.rotation.x = Math.PI / 2; rim.position.set(px, ty + 0.3, pz); add(rim);
        const pool = mesh(new THREE.CircleGeometry(0.35, 24), wm, { cast: false }); pool.rotation.x = -Math.PI / 2; pool.position.set(px, ty + 0.26, pz); add(pool);
        c.pool = pool; c.waterMeshes.push(pool);
        wm.color.setHex(lv.colored ? WATER[c.color] : WATER.plain);
        steamEmitters.push({ pos: new THREE.Vector3(px, ty + 0.3, pz), rate: 3, acc: 0, on: () => true });
      } else {
        const hit = new THREE.Mesh(new THREE.BoxGeometry(0.98, 0.5, 0.98), new THREE.MeshBasicMaterial({ visible: false }));
        hit.position.set(px, ty + 0.15, pz); hit.userData.cell = c; put(hit); hitboxes.push(hit);
      }
      if (c.yuzu) {
        const yz = new THREE.Group();
        for (let j = 0; j < 3; j++) { const y = sph(0.07, M(COLORS.yuzu)); y.position.set(Math.cos(j * 2.1) * 0.12, 0, Math.sin(j * 2.1) * 0.12); yz.add(y); }
        yz.position.set(px, ty + 0.27, pz); add(yz); c.yuzuGroup = yz;
      }
      if (c.scale) { const s = makeScale(); s.position.set(px + 0.3, ty, pz - 0.3); add(s); c.scaleG = s; const f = makeFlag(0xffc83d); f.position.set(px - 0.38, ty, pz - 0.38); add(f); }
      if (c.gate) {
        const ew = c.sol & (2 | 8);
        const door = box(ew ? 0.08 : 0.44, 0.34, ew ? 0.44 : 0.08, M(COLORS.trunk)); door.position.set(0, 0.2, 0); t.g.add(door); c.door = door;
        const f = makeFlag(0xffc83d); f.position.set(px - 0.38, ty, pz - 0.38); add(f);
      }
      if (c.link !== undefined) {
        const r = mesh(new THREE.TorusGeometry(0.17, 0.04, 8, 20), M(LINK_COLORS[c.link % LINK_COLORS.length])); r.rotation.x = Math.PI / 2; r.position.y = 0.2; t.g.add(r);
      }
      if (c.leaf) { const pile = makeLeafPile(rnd); pile.position.copy(c.pos); put(pile); c.leafPile = pile; t.g.visible = !c.leafOn; }
      if (c.ice) { const ib = mesh(new THREE.BoxGeometry(0.9, 0.38, 0.9), iceMat, { cast: false }); ib.position.set(px, ty + 0.19, pz); put(ib); c.iceBlock = ib; ib.visible = c.iceOn; }
      if (c.cloud) { const cr = makeCloudRing(); cr.position.copy(c.pos); add(cr); c.cloudG = cr; }
      if (c.lift) { const a = makeLiftArrows(); a.position.copy(c.pos); put(a); }
    } else if (c.kind === 'tub') {
      const tub = new THREE.Group(); tub.position.copy(c.pos); add(tub);
      const wall = mesh(new THREE.CylinderGeometry(0.4, 0.36, 0.34, 22, 1, true), new THREE.MeshLambertMaterial({ color: COLORS.wood, side: THREE.DoubleSide }));
      wall.position.y = 0.17; tub.add(wall);
      const floor = cyl(0.36, 0.36, 0.03, M(COLORS.woodDark), 22); floor.position.y = 0.02; tub.add(floor);
      for (const y of [0.08, 0.27]) {
        const band = mesh(new THREE.TorusGeometry(0.385 - (0.27 - y) * 0.1, y > 0.2 && c.want ? 0.035 : 0.018, 6, 28), M(y > 0.2 && c.want ? WATER[c.want] : COLORS.woodDark));
        band.rotation.x = Math.PI / 2; band.position.y = y; tub.add(band);
      }
      const wm = waterMat();
      const surf = mesh(new THREE.CircleGeometry(0.37, 24), wm, { cast: false }); surf.rotation.x = -Math.PI / 2; surf.position.y = 0.05; tub.add(surf);
      c.waterMat = wm; c.waterMeshes = [surf]; c.surf = surf;
      const capy = makeCapy(); capy.position.y = 0.03; capy.rotation.y = Math.PI / 4 + Math.floor(rnd() * 4) * Math.PI / 2; tub.add(capy);
      c.capy = capy; c.happy = 0; c.baseRot = capy.rotation.y;
      steamEmitters.push({ pos: new THREE.Vector3(px, ty + 0.4, pz), rate: 2.5, acc: 0, on: () => c.happy > 0.6 });
    } else if (c.kind === 'cat') {
      const cat = makeCat(); cat.position.copy(c.pos); cat.rotation.y = rnd() * TAU; add(cat); c.cat = cat;
    } else {
      const r = rnd();
      let deco = null;
      if (r < 0.38) deco = makeTree(rnd, th);
      else if (r < 0.66) deco = makeFlowers(rnd);
      else if (r < 0.76) deco = makeMushroom();
      else if (r < 0.86) { const g = new THREE.Group(); const rock = mesh(new THREE.DodecahedronGeometry(0.12 + rnd() * 0.06), M(COLORS.rock)); rock.position.y = 0.06; g.add(rock); deco = g; }
      if (deco) { deco.position.set(px + (rnd() - 0.5) * 0.3, ty, pz + (rnd() - 0.5) * 0.3); deco.rotation.y = rnd() * TAU; add(deco); }
    }
  }
  // ropes between linked pipes
  const groups = new Map();
  for (const c of lv.cells) if (c.link !== undefined) { if (!groups.has(c.link)) groups.set(c.link, []); groups.get(c.link).push(c); }
  for (const [id, cs] of groups) for (let k = 1; k < cs.length; k++) {
    const a = cs[k - 1].pos, b = cs[k].pos, y = Math.max(a.y, b.y) + 0.42;
    const from = new THREE.Vector3(a.x, y, a.z), to = new THREE.Vector3(b.x, y, b.z), len = from.distanceTo(to);
    const rope = mesh(new THREE.CylinderGeometry(0.02, 0.02, len, 6), M(LINK_COLORS[id % LINK_COLORS.length]), { cast: false });
    rope.position.copy(from).add(to).multiplyScalar(0.5);
    rope.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), to.clone().sub(from).normalize());
    add(rope);
    for (const p of [a, b]) { const knot = cyl(0.015, 0.015, y - p.y - 0.2, M(LINK_COLORS[id % LINK_COLORS.length]), 6, { cast: false }); knot.position.set(p.x, (y + p.y + 0.2) / 2, p.z); add(knot); }
  }
  view.target = view.rot = showcase ? view.rot : 0;
  fitCamera(maxH);
  lastFlow = null;
  refreshFlow(true);
  if (showcase) for (const c of lv.cells) { c.wet = c.wetTarget; c.wetDelay = 0; if (c.capy) c.happy = c.happyTarget; }
}

// ---------- flow and water ----------
function waterColorFor(colors) {
  if (!lv.colored || !colors) return WATER.plain;
  if (colors.size > 1) return WATER.mixed;
  return WATER[[...colors][0]];
}
function refreshFlow(silent) {
  const prev = lastFlow;
  const { f, thawed } = settle(lv);
  // distance from the springs along wet links, so water visibly travels
  const dist = new Map(lv.srcs.map(s => [s, 0])), q = [...lv.srcs];
  while (q.length) {
    const c = q.shift();
    for (const l of f.links) if (l.a === c && !dist.has(l.b)) { dist.set(l.b, dist.get(c) + 1); q.push(l.b); }
  }
  let maxDelay = 0;
  for (const c of lv.cells) {
    const now = f.wet.has(c) ? 1 : 0;
    if (now && c.waterMat) c.waterMat.color.setHex(waterColorFor(f.wet.get(c)));
    if (now !== c.wetTarget) {
      c.wetTarget = now;
      c.wetDelay = now ? (dist.get(c) || 0) * 0.13 : 0;
    }
    if (now) maxDelay = Math.max(maxDelay, c.wetDelay);
    if (c.kind === 'tub') { c.happyTarget = f.filled.includes(c) ? 1 : 0; c.mixed = f.mixed.includes(c); }
  }
  for (const c of thawed) c.meltT = 0;
  // waterfalls (and cloud spouts) where water changes level between cells
  for (const fl of falls) pivot.remove(fl.mesh);
  falls = [];
  for (const l of f.links) {
    if (l.a.h === l.b.h) continue;
    const dir = DIRS.find(d => d[2] === l.bit);
    const ya = l.a.h * STEP_H + 0.18, yb = l.b.h * STEP_H + 0.12;
    const top = Math.max(ya, yb), bottom = Math.min(ya, yb), hgt = top - bottom;
    const along = dir[0] !== 0;
    const m = mesh(new THREE.BoxGeometry(along ? 0.07 : 0.24, hgt, along ? 0.24 : 0.07), l.b.waterMat || waterMat(), { cast: false });
    m.position.set(l.a.pos.x + dir[0] * 0.5, bottom + hgt / 2, l.a.pos.z + dir[1] * 0.5);
    pivot.add(m); falls.push({ mesh: m, cell: l.b });
  }
  lastFlow = f;
  if (!silent) {
    const had = (list, c) => prev && list(prev).includes(c);
    const newTubs = f.filled.filter(t => !had(p => p.filled, t));
    newTubs.forEach(t => Sound.capy(t.wetDelay + 0.25));
    if (!newTubs.length && prev && f.wet.size > prev.wet.size) Sound.drop();
    if (thawed.length) { Sound.melt(0.15); toast('얼음이 녹았어요. 이제 돌릴 수 있어요'); }
    if (prev && f.gateOpen !== prev.gateOpen) { Sound.gate(f.gateOpen); if (f.gateOpen) Sound.ding(); toast(f.gateOpen ? '유자 저울이 기울었어요. 수문이 열렸어요!' : '유자 저울이 말라서 수문이 닫혔어요'); }
    const newMixed = f.mixed.filter(t => !had(p => p.mixed, t));
    if (newMixed.length) { Sound.mix(maxDelay); toast('물이 섞였어요. 욕조 테두리와 같은 색 물만 보내 주세요'); }
    const newCats = f.wetCats.filter(c => !had(p => p.wetCats, c));
    if (newCats.length) { Sound.meow(maxDelay); toast('고양이가 놀랐어요! 고양이 쪽 물길을 돌려 주세요'); }

  if (g.until === 'clear') return !c.leafOn;
  if (g.until === 'thaw') return !c.iceOn;

function hintCell() {

    if (c.leafPile && c.leafPile.visible && !c.leafOn) {
      c.leafT += dt;
      c.leafPile.children.forEach((l, n) => { l.position.y += dt * (1.2 + n * 0.08); l.position.x += dt * Math.cos(n) * 0.8; l.rotation.z += dt * 6; });
      if (c.leafT > 0.8) c.leafPile.visible = false;
    }
    if (c.iceBlock && c.iceBlock.visible && !c.iceOn) {
      if (c.meltT === undefined) c.meltT = 0;
      c.meltT += dt;
      const k = Math.max(0, 1 - c.meltT / 0.8);
      c.iceBlock.scale.set(k, k, k);
      if (Math.random() < dt * 12) spawnSteam(c.pos.clone().add(new THREE.Vector3(0, 0.3 + cellY(c), 0)));
      if (k <= 0) c.iceBlock.visible = false;
    }
    if (c.cloudG) { c.cloudG.position.y = c.pos.y + Math.sin(t * 1.5 + c.x) * 0.03; c.cloudG.rotation.y += dt * 0.2; }
    if (c.wetDelay > 0) c.wetDelay -= dt;
    else c.wet += (c.wetTarget - c.wet) * Math.min(1, dt * 5);
    if (c.waterMat) {
      c.waterMat.opacity = c.wet * 0.92;
      for (const w of c.waterMeshes) w.visible = c.wet > 0.02;
    }
    if (c.pool) c.pool.position.y = c.pos.y + 0.26 + Math.sin(t * 3) * 0.008;
    if (c.surf) c.surf.position.y = 0.05 + c.wet * 0.2 + Math.sin(t * 2 + c.x) * 0.006;
    if (c.capy) {
      const want = c.happyTarget && c.wet > 0.6 ? 1 : 0;
      if (want && c.happy < 0.01) c.hopT = 0;
      c.happy += (want - c.happy) * Math.min(1, dt * 4);
      for (const e of c.capy.userData.eyes) e.scale.y = 0.036 * (1 - c.happy * 0.82);
      const yz = c.capy.userData.yuzu; yz.visible = c.happy > 0.05; yz.scale.setScalar(Math.max(0.001, c.happy));
      if (c.hopT !== undefined && c.hopT < 1) { c.hopT += dt * 2.2; c.capy.position.y = 0.03 + Math.sin(Math.min(1, c.hopT) * Math.PI) * 0.22; }
      else c.capy.position.y = 0.03 + (reduced ? 0 : Math.sin(t * 1.6 + c.x * 2) * 0.008 * c.happy);
      // shiver while waiting; shake the head at mixed water
      c.capy.rotation.z = c.happy < 0.5 && !reduced ? Math.sin(t * 30) * 0.012 : 0;
      c.capy.rotation.y = c.baseRot + (c.mixed && !reduced ? Math.sin(t * 9) * 0.25 : 0);
    }
    if (c.cat) {
      const wet = c.wet > 0.4;
      c.cat.userData.alert.visible = wet;
      c.cat.userData.cat.position.y = wet && !reduced ? Math.abs(Math.sin(t * 7)) * 0.16 : Math.sin(t * 1.4) * 0.004;
    }
    if (c.yuzuGroup) {
      c.yuzuGroup.position.y = c.pos.y + 0.27 + c.wet * (0.08 + Math.sin(t * 2.4 + c.x) * 0.03);
      c.yuzuGroup.rotation.y += dt * c.wet * 0.8;
    }
  }
  for (const fl of falls) fl.mesh.visible = fl.cell.wet > 0.05;
  for (const o of levelObjs) if (o.userData.drift) o.position.x += Math.sin(t * o.userData.drift) * 0.002;

  if (highlight && mode === 'play') {
    ring.visible = true;
    ring.position.set(highlight.pos.x, highlight.pos.y + cellY(highlight) + 0.24, highlight.pos.z);
    const s = 1 + (reduced ? 0 : Math.sin(t * 5) * 0.08);
    ring.scale.set(s, s, s);
    ring.material.opacity = 0.75 + Math.sin(t * 5) * 0.2;
  } else ring.visible = false;

  for (const em of steamEmitters) {
    if (!em.on()) continue;
    em.acc += dt * em.rate;
    while (em.acc > 1) { em.acc -= 1; spawnSteam(em.pos); }
  }
  for (const p of particles) {
    p.age += dt;
    const k = p.age / p.life;
    p.sprite.position.y += dt * 0.35; p.sprite.position.x += p.vx * dt;
    p.sprite.scale.setScalar((0.16 + k * 0.4) * p.size);
    p.sprite.material.opacity = Math.sin(Math.min(1, k) * Math.PI) * 0.55;
  }
  particles = particles.filter(p => { if (p.age < p.life) return true; pivot.remove(p.sprite); p.sprite.material.dispose(); return false; });

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

// ---------- boot ----------
renderSound();
window.claude?.hot?.snapshot?.(() => ({ mode, levelIndex }));
function boot(data) {
  if (data && data.mode === 'play' && Number.isInteger(data.levelIndex)) startLevel(data.levelIndex, true);
  else showTitle();
  requestAnimationFrame(tick);
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
