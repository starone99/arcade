<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="탭 한 번으로 두 갈래 길을 오가며 장애물을 피하고, 로켓으로 부수며 달리는 카피바라 러너">
<style>[hidden]{display:none!important}</style>
<title>카피바라 대시</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one full-screen canvas runner; a thin HUD on top, overlay cards for start and results.
   One deliberate look: a bright summer road at speed. */
:root {
  --ink: #23302c;
  --panel: #fffdf8;
  --panel-line: #e7dcc9;
  --yuzu: #ffa236;
  --yuzu-deep: #dd7a0e;
  --boost: #ff5a3c;
  --muted: #6c7a74;
  --f-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; overflow: hidden; background: #7cc56f; color: var(--ink); font-family: var(--f-body); }
#app { position: relative; height: 100%; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--yuzu); outline-offset: 2px; }
.hud { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: max(12px, env(safe-area-inset-top, 0px)) 14px 0; pointer-events: none; }
.hud > * { pointer-events: auto; }
.score { font-family: var(--f-display); font-size: 40px; line-height: 1; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.18), 0 0 18px rgba(0,0,0,.15); font-variant-numeric: tabular-nums; }
.score small { display: block; font-size: 14px; margin-top: 4px; opacity: .9; }
.pills { display: flex; gap: 8px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: rgba(255,253,248,.92); font-family: var(--f-display); font-size: 17px; font-variant-numeric: tabular-nums; box-shadow: 0 4px 12px rgba(0,0,0,.12); }
.pill svg { width: 18px; height: 18px; }
.round { width: 42px; height: 42px; border-radius: 50%; border: 0; display: grid; place-items: center; background: rgba(255,253,248,.92); box-shadow: 0 4px 12px rgba(0,0,0,.12); }
.round svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.overlay { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px)); }
.card { width: min(400px, 100%); background: var(--panel); border-radius: 26px; padding: 22px; text-align: center; box-shadow: 0 6px 0 var(--panel-line), 0 24px 60px rgba(0,0,0,.25); }
h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(34px, 10vw, 46px); line-height: 1.05; }
h1 em { font-style: normal; color: var(--boost); }
.card p { margin: 10px auto 16px; color: var(--muted); max-width: 26em; text-wrap: balance; }
.howto { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 0 18px; }
.howto div { background: #f6f1e7; border-radius: 16px; padding: 10px 6px; font-size: 12px; line-height: 1.35; }
.howto svg { display: block; width: 34px; height: 34px; margin: 0 auto 4px; }
.primary { border: 0; border-radius: 18px; padding: 14px 26px; min-width: 180px; background: var(--boost); color: #fff; font-family: var(--f-display); font-size: 21px; box-shadow: 0 5px 0 #c8402a; }
.primary:active { transform: translateY(3px); box-shadow: 0 2px 0 #c8402a; }
.note { margin-top: 12px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.result h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 30px; }
.big { font-family: var(--f-display); font-size: 56px; line-height: 1.1; color: var(--boost); font-variant-numeric: tabular-nums; }
.newbest { display: inline-block; padding: 2px 12px; border-radius: 999px; background: var(--yuzu); color: #fff; font-family: var(--f-display); font-size: 15px; animation: pulse .8s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.08); } }
.stats { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 12px 0 18px; }
.stats span { padding: 4px 12px; border-radius: 999px; background: #f3ede2; font-size: 14px; font-variant-numeric: tabular-nums; }
.tapnote { margin-top: 10px; font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .newbest { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <canvas id="game" aria-label="카피바라가 두 갈래 길을 달려요. 화면을 탭하면 길을 바꿔요."></canvas>

  <header class="hud" id="hud" hidden>
    <div class="score"><span id="score">0</span><small id="best"></small></div>
    <div class="pills">
      <span class="pill"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="11.5" r="7.5" fill="#ffa236"/><ellipse cx="13" cy="4" rx="3.6" ry="1.8" transform="rotate(-28 13 4)" fill="#5fae6b"/></svg><span id="yuzuCount">0</span></span>
      <button type="button" class="round" id="soundBtn" aria-label="소리 끄기"><svg viewBox="0 0 24 24" id="soundIcon"></svg></button>
      <button type="button" class="round" id="pauseBtn" aria-label="일시정지"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button>
    </div>
  </header>

  <section class="overlay" id="start">
    <div class="card">
      <h1>카피바라 <em>대시</em></h1>
      <p>두 갈래 길을 달리며 장애물을 피해요. 로켓을 먹으면 모든 걸 부수며 질주해요!</p>
      <div class="howto">
        <div><svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="9" fill="none" stroke="#23302c" stroke-width="2.4"/><circle cx="17" cy="17" r="3.5" fill="#ff5a3c"/></svg>탭하면<br>길 바꾸기</div>
        <div><svg viewBox="0 0 34 34" aria-hidden="true"><path d="M17 4 c6 6 6 16 0 22 c-6 -6 -6 -16 0 -22z" fill="#ff5a3c"/><path d="M13 26 l4 6 l4 -6" fill="#ffa236"/></svg>로켓으로<br>부수며 질주</div>
        <div><svg viewBox="0 0 34 34" aria-hidden="true"><path d="M6 24 l10 -14 l2 6 l10 -4" stroke="#23302c" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>아슬아슬하게<br>피하면 보너스</div>
      </div>
      <button type="button" class="primary" id="goBtn">달리기</button>
      <div class="note" id="startNote"></div>
    </div>
  </section>

  <section class="overlay" id="paused" hidden>
    <div class="card"><h1>잠깐 쉬어요</h1><p>준비되면 다시 달려요.</p><button type="button" class="primary" id="resumeBtn">계속 달리기</button></div>
  </section>

  <section class="overlay" id="result" hidden>
    <div class="card result">
      <h2 id="resultTitle">쿵!</h2>
      <div class="big" id="resultScore">0</div>
      <span class="newbest" id="newBest" hidden>최고 기록!</span>
      <div class="stats" id="resultStats"></div>
      <button type="button" class="primary" id="againBtn">다시 달리기</button>
      <div class="tapnote">화면 아무 곳이나 눌러도 다시 달려요</div>
    </div>
  </section>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- save ----------
const SAVE_KEY = 'capy-dash:v1';   // shared localStorage on starone99.github.io, so keys carry a game prefix
function loadSave() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { /* storage unavailable */ }
  if (!s || typeof s.best !== 'number') s = { best: 0, runs: 0, yuzu: 0, sound: true };
  return s;
}
const save = loadSave();
function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* storage unavailable */ } }

// ---------- sound: synthesized sfx and a beat that speeds up with you ----------
const Sound = {
  ctx: null, master: null, music: null, noiseBuf: null, nextBeat: 0, step: 0, bpm: 120,
  ensure() {
    if (!save.sound) return null;
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.85; this.master.connect(this.ctx.destination);
      this.music = this.ctx.createGain(); this.music.gain.value = 0.0; this.music.connect(this.master);
      this.noiseBuf = this.ctx.createBuffer(1, this.ctx.sampleRate, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  tone(freq, dur, { type = 'sine', gain = 0.12, to = null, delay = 0, out = null } = {}) {
    const ctx = this.ensure(); if (!ctx) return;
    const t = ctx.currentTime + delay, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out || this.master); o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, { freq = 1000, q = 1, gain = 0.1, delay = 0, type = 'bandpass', to = null, out = null, at = null } = {}) {
    const ctx = this.ensure(); if (!ctx) return;
    const t = at ?? ctx.currentTime + delay, src = ctx.createBufferSource(); src.buffer = this.noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (to) f.frequency.exponentialRampToValueAtTime(to, t + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(out || this.master); src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
  },
  whoosh() { this.noise(0.16, { freq: 900, q: 0.8, gain: 0.12, to: 3200 }); },
  yuzu(combo) { const f = 880 * Math.pow(2, Math.min(combo, 14) / 12); this.tone(f, 0.12, { type: 'triangle', gain: 0.08 }); this.tone(f * 1.5, 0.1, { gain: 0.03, delay: 0.03 }); },
  smash() { this.noise(0.35, { freq: 600, q: 0.6, gain: 0.3, type: 'lowpass', to: 200 }); this.tone(90, 0.25, { type: 'triangle', gain: 0.3, to: 45 }); this.noise(0.12, { freq: 4000, q: 1, gain: 0.08 }); },
  hit() { this.noise(0.5, { freq: 500, q: 0.5, gain: 0.35, type: 'lowpass', to: 120 }); this.tone(140, 0.4, { type: 'sawtooth', gain: 0.12, to: 40 }); },
  boost() { this.tone(160, 0.7, { type: 'sawtooth', gain: 0.1, to: 640 }); this.noise(0.9, { freq: 400, q: 0.7, gain: 0.14, to: 3000 }); },
  item() { [784, 988, 1175].forEach((f, i) => this.tone(f, 0.14, { type: 'triangle', gain: 0.07, delay: i * 0.05 })); },
  near() { this.noise(0.2, { freq: 2500, q: 2, gain: 0.08, to: 600 }); this.tone(1320, 0.1, { gain: 0.04 }); },
  pop() { this.tone(600, 0.12, { gain: 0.08, to: 1200 }); this.noise(0.1, { freq: 3000, q: 1, gain: 0.05 }); },
  // music: kick, hat and a little bass line; tempo follows the run speed
  tickMusic(speedK, boosting) {
    if (!this.ctx || !save.sound) return;
    const ctx = this.ctx;
    this.bpm = 116 + speedK * 44 + (boosting ? 20 : 0);
    const spb = 60 / this.bpm / 2;   // eighth notes
    if (this.nextBeat < ctx.currentTime) this.nextBeat = ctx.currentTime + 0.05;
    const bass = [55, 55, 65.4, 55, 73.4, 65.4, 55, 82.4];
    while (this.nextBeat < ctx.currentTime + 0.12) {
      const t = this.nextBeat, s = this.step % 16;
      if (s % 4 === 0) { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12); g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16); o.connect(g); g.connect(this.music); o.start(t); o.stop(t + 0.2); }
      this.noise(0.04, { freq: 8000, q: 1, gain: s % 2 ? 0.05 : 0.09, type: 'highpass', out: this.music, at: t });
      if (s % 2 === 0) { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'triangle'; o.frequency.value = bass[(s / 2) % 8] * (boosting ? 2 : 1); g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.0001, t + spb * 1.8); o.connect(g); g.connect(this.music); o.start(t); o.stop(t + spb * 2); }
      if (boosting && s % 4 === 2) { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'square'; o.frequency.value = [523, 659, 784, 659][(this.step >> 2) % 4]; g.gain.setValueAtTime(0.04, t); g.gain.exponentialRampToValueAtTime(0.0001, t + spb); o.connect(g); g.connect(this.music); o.start(t); o.stop(t + spb); }
      this.nextBeat += spb; this.step++;
    }
  },
  musicOn(on) { if (!this.music) return; this.music.gain.setTargetAtTime(on ? 0.32 : 0, this.ctx.currentTime, 0.15); },
  setOn(on) { save.sound = on; writeSave(); if (this.master) this.master.gain.value = on ? 0.85 : 0; if (on) this.ensure(); },
};
const buzz = ms => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* not allowed here */ } };

// ---------- canvas and projection ----------
const cv = $('#game'), g = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
let horizon = 0, playerY = 0, roadHalf = 0, K = 320;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  horizon = H * 0.16; playerY = H * 0.8;
  roadHalf = Math.min(W * 0.36, 230);
}
window.addEventListener('resize', resize); resize();
// distance ahead (d, world units) -> screen y and scale; d = 0 is the capybara's line
const scaleAt = d => K / (K + Math.max(-K * 0.6, d));
const yAt = d => horizon + (playerY - horizon) * scaleAt(d);
const laneX = (lane, d) => W / 2 + (lane === 0 ? -1 : 1) * roadHalf * 0.5 * scaleAt(d);

// ---------- game state ----------
const LANE_TIME = 0.12;
let state = 'title', t = 0, dist = 0, speed = 0, score = 0, yuzu = 0, combo = 0, comboT = 0, smashCombo = 0, nearCount = 0, smashed = 0;
let lane = 1, laneFrom = 1, laneT = 1, boostT = 0, magnetT = 0, shield = false, hitstop = 0, slowmo = 0, shake = 0, flash = 0, dead = false, deadT = 0;
let objs = [], parts = [], texts = [], streaks = [], scenery = [], nextSpawn = 0, lastPatternLane = 0, speedLevel = 0, rocketIn = 0, itemIn = 0;
const BASE_SPEED = 560, MAX_SPEED = 1450, BOOST_MUL = 2.3;

function reset() {
  t = 0; dist = 0; speed = BASE_SPEED; score = 0; yuzu = 0; combo = 0; comboT = 0; nearCount = 0; smashed = 0; smashCombo = 0;
  lane = 1; laneFrom = 1; laneT = 1; boostT = 0; magnetT = 0; shield = false; hitstop = 0; slowmo = 0; shake = 0; flash = 0; dead = false; deadT = 0;
  objs = []; parts = []; texts = []; nextSpawn = 900; speedLevel = 0; rocketIn = rand(9, 13); itemIn = rand(14, 20);
  scenery = [];
  for (let d = -200; d < 2400; d += rand(60, 120)) addScenery(d);
}
function addScenery(d) {
  const side = Math.random() < 0.5 ? -1 : 1;
  const kinds = ['tree', 'tree', 'bush', 'lantern', 'flower', 'reed'];
  scenery.push({ d, side, off: rand(1.25, 2.4), kind: kinds[Math.floor(Math.random() * kinds.length)], hue: Math.random() });
}
// obstacle patterns, always leaving a way through at the current speed
function spawnPattern() {
  const sp = effectiveSpeed();
  const tight = Math.max(0.42, 0.62 - speedLevel * 0.03);
  const gap = sp * rand(tight, tight + 0.28);       // room to react between rows
  const base = nextSpawn;
  let used = 0;
  const pick = () => (Math.random() < 0.55 ? 1 - lastPatternLane : lastPatternLane);
  // while boosting: walls to smash and yuzu to sweep, only as far as the boost will carry you
  if (boostT > 0 && base < boostT * sp - sp * 0.5) {
    const kind = ['rock', 'log', 'rock', 'crab'][Math.floor(Math.random() * 4)];
    for (const l of [0, 1]) objs.push(kind === 'crab' ? { kind, lane: l, d: base, dir: 0, x: l, wait: 99 } : { kind, lane: l, d: base });
    for (let i = 1; i <= 3; i++) objs.push({ kind: 'yuzu', lane: i % 2, d: base + i * 45 });
    nextSpawn = base + rand(150, 220);
    return;
  }
  if (rocketIn <= 0 && boostT <= 0) {
    const l = pick();
    objs.push({ kind: 'rocket', lane: l, d: base });
    for (let i = 1; i <= 3; i++) objs.push({ kind: 'yuzu', lane: l, d: base - i * 70 });
    rocketIn = rand(18, 26);
    nextSpawn = base + gap * 1.4;
    return;
  }
  if (itemIn <= 0) {
    const l = pick();
    objs.push({ kind: Math.random() < 0.5 ? 'magnet' : 'bubble', lane: l, d: base });
    itemIn = rand(13, 19);
    nextSpawn = base + gap;
    return;
  }
  const r = Math.random();
  if (r < 0.45) {
    // zigzag: alternate lanes with yuzu along the safe side
    const n = 2 + Math.floor(Math.random() * (2 + Math.min(4, speedLevel)));
    let l = pick();
    for (let i = 0; i < n; i++) {
      objs.push({ kind: Math.random() < 0.6 ? 'rock' : 'log', lane: l, d: base + i * gap });
      objs.push({ kind: 'yuzu', lane: 1 - l, d: base + i * gap });
      l = 1 - l;
    }
    lastPatternLane = 1 - l;
    used = n * gap;
  } else if (r < 0.6 && dist > 2500) {
    // a crab scuttling across: dodge to the lane it is leaving
    const l = pick();
    objs.push({ kind: 'crab', lane: l, d: base, dir: l === 0 ? 1 : -1, x: l, wait: rand(0.2, 0.5) });
    used = gap * 1.2;
  } else if (r < 0.8) {
    // a row of yuzu with a rock at the end
    const l = pick();
    for (let i = 0; i < 6; i++) objs.push({ kind: 'yuzu', lane: l, d: base + i * 60 });
    objs.push({ kind: 'rock', lane: l, d: base + 6 * 60 + gap * 0.5 });
    lastPatternLane = 1 - l;
    used = 6 * 60 + gap;
  } else {
    // pair of obstacles in one lane
    const l = pick();
    objs.push({ kind: 'rock', lane: l, d: base });
    objs.push({ kind: 'log', lane: l, d: base + 90 });
    for (let i = 0; i < 4; i++) objs.push({ kind: 'yuzu', lane: 1 - l, d: base + i * 50 });
    lastPatternLane = 1 - l;
    used = 90 + gap;
  }
  nextSpawn = base + used + gap * rand(0.8, 1.3);
}
const effectiveSpeed = () => speed * (boostT > 0 ? BOOST_MUL : 1);
const laneNow = () => (laneT > 0.5 ? lane : laneFrom);
const laneVisual = () => { const k = clamp(laneT, 0, 1), e = 1 - (1 - k) ** 3; return laneFrom + (lane - laneFrom) * e; };

// ---------- input: tap anywhere ----------
function tap() {
  Sound.ensure();
  if (state === 'title') { start(); return; }
  if (state === 'over') { if (deadT > 0.6) start(); return; }
  if (state !== 'run' || dead) return;
  laneFrom = laneNow(); lane = 1 - laneFrom; laneT = 0;
  Sound.whoosh(); buzz(8);
  // near miss: something in the lane we just left, right in front of us
  const threat = objs.find(o => isHazard(o) && o.lane === laneFrom && o.d > 0 && o.d < effectiveSpeed() * 0.16);
  if (threat && boostT <= 0) {
    nearCount++; score += 15 * (1 + speedLevel);
    float('아슬아슬! +' + 15 * (1 + speedLevel), laneX(laneFrom, 0), playerY - 60, '#fff');
    slowmo = 0.18; Sound.near();
  }
  for (let i = 0; i < 6; i++) parts.push({ x: laneX(laneFrom, 0), y: playerY + 18, vx: rand(-60, 60) + (lane - laneFrom) * 120, vy: rand(-40, 10), life: 0.35, age: 0, r: rand(3, 6), c: 'rgba(255,255,255,0.8)' });
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); tap(); });
$('#result').addEventListener('pointerdown', e => { if (e.target.closest('button')) return; tap(); });
document.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowLeft' || e.code === 'ArrowRight') { e.preventDefault(); if (state === 'run') tap(); } });

const isHazard = o => o.kind === 'rock' || o.kind === 'log' || o.kind === 'crab';

function update(dt) {

  const myLane = laneNow();

    const sameLane = o.kind === 'crab' ? Math.abs(o.x - myLane) < 0.45 : o.lane === myLane;
    if (!sameLane) continue;
    if (o.kind === 'yuzu') { o.gone = true; collectYuzu(o); continue; }

    if (o.kind === 'magnet') { o.gone = true; magnetT = 7; Sound.item(); float('유자 자석!', W / 2, H * 0.4, '#fff', 1, 30); continue; }
    if (o.kind === 'bubble') { o.gone = true; shield = true; Sound.item(); float('거품 방패!', W / 2, H * 0.4, '#fff', 1, 30); continue; }
    if (isHazard(o)) {
      if (boostT > 0) { smash(o); continue; }
      if (shield) { shield = false; o.gone = true; burst(o, 14, ['#bfe9ff', '#fff']); Sound.pop(); float('방패가 막았어요', W / 2, H * 0.42, '#fff', 0.9, 26); shake = 6; continue; }
      die(o);
    }
  }

  for (const p of parts) { p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt; }

  for (const tx of texts) tx.age += dt;
  texts = texts.filter(tx => tx.age < tx.life);
  const want = Math.floor((sp / MAX_SPEED) * 26 + (boostT > 0 ? 30 : 0));
  while (streaks.length < want) streaks.push({ x: rand(0, 1), y: rand(-0.2, 1), len: rand(0.05, 0.16), w: rand(1, 3) });
  if (streaks.length > want) streaks.length = want;
  for (const s of streaks) { s.y += dt * (sp / 600) * 1.6; if (s.y > 1.2) { s.y = rand(-0.3, -0.05); s.x = Math.random() < 0.5 ? rand(0, 0.22) : rand(0.78, 1); } }

}

  g.lineTo(W, horizon + 4); g.closePath(); g.fill();

  g.fillStyle = grass; g.fillRect(0, horizon, W, H - horizon);

    g.fillRect(0, yAt(d2), W, Math.max(1, yAt(d) - yAt(d2)));
  }

  g.fillStyle = '#e9d7b6';
  g.beginPath();
  g.moveTo(W / 2 - roadHalf * scaleAt(far), yAt(far)); g.lineTo(W / 2 + roadHalf * scaleAt(far), yAt(far));
  g.lineTo(W / 2 + roadHalf * scaleAt(-K * 0.55), yAt(-K * 0.55)); g.lineTo(W / 2 - roadHalf * scaleAt(-K * 0.55), yAt(-K * 0.55));
  g.closePath(); g.fill();

  for (const s of [-1, 1]) { g.beginPath(); g.moveTo(W / 2 + s * roadHalf * scaleAt(far), yAt(far)); g.lineTo(W / 2 + s * roadHalf * scaleAt(-K * 0.55), yAt(-K * 0.55)); g.stroke(); }
  // centre dashes
  g.fillStyle = '#fff8e6';
  for (let k = 0; k < 30; k++) {
    const d = ((k * 110 - dist) % 3300 + 3300) % 3300 - 140;
    const d2 = d + 55, y1 = yAt(d), y2 = yAt(d2), w1 = 6 * scaleAt(d), w2 = 6 * scaleAt(d2);
    g.beginPath(); g.moveTo(W / 2 - w2, y2); g.lineTo(W / 2 + w2, y2); g.lineTo(W / 2 + w1, y1); g.lineTo(W / 2 - w1, y1); g.closePath(); g.fill();

}
function drawScenery() {

    if (s.d > 2800) continue;

  drawYuzu(0, -54 * S, 9 * S, boostT > 0);
  g.restore();
  if (shield) { g.strokeStyle = 'rgba(120,200,255,0.9)'; g.lineWidth = 4; g.fillStyle = 'rgba(160,220,255,0.18)'; g.beginPath(); g.arc(x, y - 4 * S, 52 * S + Math.sin(t * 6) * 3, 0, TAU); g.fill(); g.stroke(); }
  if (magnetT > 0) { g.strokeStyle = `rgba(122,108,255,${0.4 + Math.sin(t * 10) * 0.2})`; g.lineWidth = 3; g.setLineDash([6, 8]); g.beginPath(); g.arc(x, y - 4 * S, 70 * S, 0, TAU); g.stroke(); g.setLineDash([]); }
}
function render() {
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sh = reduced ? 0 : shake;
  g.save();
  g.translate(rand(-sh, sh), rand(-sh, sh));
  // a punchy zoom while boosting
  if (boostT > 0 && !reduced) { const z = 1.04 + Math.sin(t * 20) * 0.006; g.translate(W / 2, playerY); g.scale(z, z); g.translate(-W / 2, -playerY); }
  drawWorld();
  drawScenery();
  // objects far to near, the capybara drawn in its depth slot
  const list = objs.slice().sort((a, b) => b.d - a.d);
  let drawn = false;
  for (const o of list) { if (!drawn && o.d < 0) { drawCapy(); drawn = true; } if (o.d < 2800) drawObj(o); }
  if (!drawn) drawCapy();
  // particles
  for (const p of parts) {
    const k = 1 - p.age / p.life;
    g.globalAlpha = Math.max(0, k);
    g.fillStyle = p.c;
    if (p.sq) { g.save(); g.translate(p.x, p.y); g.rotate(p.age * (p.spin || 0)); g.fillRect(-p.r, -p.r, p.r * 2, p.r * 2); g.restore(); }
    else { g.beginPath(); g.arc(p.x, p.y, p.r, 0, TAU); g.fill(); }
  }
  g.globalAlpha = 1;
  g.restore();
  // speed lines
  if (!reduced) {
    g.strokeStyle = boostT > 0 ? 'rgba(255,240,200,0.75)' : 'rgba(255,255,255,0.45)';
    for (const s of streaks) { g.lineWidth = s.w; g.beginPath(); g.moveTo(s.x * W, s.y * H); g.lineTo(s.x * W, (s.y + s.len) * H); g.stroke(); }
  }
  // vignette while boosting, flash on impacts
  if (boostT > 0) {
    const v = g.createRadialGradient(W / 2, H * 0.6, Math.min(W, H) * 0.3, W / 2, H * 0.6, Math.max(W, H) * 0.75);
    v.addColorStop(0, 'rgba(255,90,60,0)'); v.addColorStop(1, `rgba(255,90,60,${0.35 + Math.sin(t * 12) * 0.08})`);
    g.fillStyle = v; g.fillRect(0, 0, W, H);
    // boost timer bar
    g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(W * 0.2, H - 18, W * 0.6, 6);
    g.fillStyle = '#fff'; g.fillRect(W * 0.2, H - 18, W * 0.6 * clamp(boostT / 5.5, 0, 1), 6);
  }
  if (flash > 0 && !reduced) { g.fillStyle = `rgba(255,255,255,${flash * 0.6})`; g.fillRect(0, 0, W, H); }
  // floating texts
  for (const tx of texts) {
    const k = tx.age / tx.life, s = 1 + (k < 0.15 ? (0.15 - k) * 4 : 0);
    g.globalAlpha = Math.min(1, (1 - k) * 2);
    g.font = `${Math.round(tx.size * s)}px Jua, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineWidth = 6; g.strokeStyle = 'rgba(35,48,44,0.55)'; g.strokeText(tx.text, tx.x, tx.y - k * 40);
    g.fillStyle = tx.color; g.fillText(tx.text, tx.x, tx.y - k * 40);
  }
  g.globalAlpha = 1;
  if (combo >= 3 && state === 'run') {
    g.font = '22px Jua, sans-serif'; g.textAlign = 'right'; g.fillStyle = '#fff'; g.lineWidth = 5; g.strokeStyle = 'rgba(35,48,44,0.4)';
    const txt = `유자 ${combo}콤보`; g.strokeText(txt, W - 16, H * 0.16 + 46); g.fillText(txt, W - 16, H * 0.16 + 46);
  }
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === 'paused') { render(); requestAnimationFrame(frame); return; }
  if (hitstop > 0) { hitstop -= dt; dt = 0; }
  if (slowmo > 0) { slowmo -= dt; dt *= 0.35; }
  if (state === 'title') { t += dt; dist += 300 * dt; for (const s of scenery) s.d -= 300 * dt; scenery = scenery.filter(s => s.d > -K * 0.55); while (scenery.length < 46) addScenery(Math.max(0, ...scenery.map(s => s.d)) + rand(50, 110)); laneT += dt / LANE_TIME; if (Math.random() < dt * 0.6) { laneFrom = laneNow(); lane = 1 - laneFrom; laneT = 0; } }
  else update(dt);
  if (state === 'run' && !dead) Sound.tickMusic(clamp((speed - BASE_SPEED) / (MAX_SPEED - BASE_SPEED), 0, 1), boostT > 0);
  render();
  requestAnimationFrame(frame);
}
reset();
renderSound();
$('#startNote').textContent = save.runs ? `최고 기록 ${save.best.toLocaleString('ko-KR')} · 지금까지 모은 유자 ${save.yuzu}개` : '스페이스바로도 길을 바꿀 수 있어요';
requestAnimationFrame(frame);
})();
</script>
</body>
