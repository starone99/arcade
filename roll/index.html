<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="귤 상자를 굴려 온천 구멍에 세우는 3D 힐링 퍼즐">
<style>[hidden]{display:none!important}</style>
<title>데굴데굴 귤 상자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: full-screen pond diorama; HUD on top, tools bottom-left, iso d-pad bottom-right; overlays for title / gardens / cards / clear.
   One deliberate light look: stepping stones on a calm morning pond. */
:root {
  --sky-top: #c9e9f2;
  --sky-bot: #fdebd3;
  --ink: #284650;
  --ink-soft: #5f7b83;
  --panel: #fffdf8;
  --panel-line: #eadfce;
  --yuzu: #ffa236;
  --yuzu-deep: #dd7a0e;
  --moss: #6cba86;
  --blush: #ff9fb2;
  --locked: #cfd8d6;
  --f-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bot) 100%);
  color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
}
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--yuzu); outline-offset: 2px; }
#app { position: relative; height: 100%; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.round {
  width: 46px; height: 46px; border-radius: 50%; border: 0; display: grid; place-items: center;
  background: var(--panel); box-shadow: 0 3px 0 var(--panel-line), 0 8px 18px rgba(40, 70, 80, .12);
}
.round svg { width: 22px; height: 22px; stroke: var(--ink); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.round:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--panel-line); }
.round:disabled { opacity: .45; cursor: default; }

.hud {
  position: absolute; left: 0; right: 0; top: 0; display: grid; grid-template-columns: auto 1fr auto; align-items: start; gap: 10px;
  padding: max(12px, env(safe-area-inset-top, 0px)) 16px 0; pointer-events: none;
}
.hud > * { pointer-events: auto; }
.hud-right { display: flex; gap: 8px; }
.stage-name { justify-self: center; text-align: center; min-width: 0; }
.stage-name b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 22px; line-height: 1.2; text-wrap: balance; }
.stage-name > span { display: inline-block; margin-top: 4px; padding: 2px 12px; border-radius: 999px; background: rgba(255, 253, 248, .75); font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.goals { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 6px; margin-top: 6px; }
.goal { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px 2px 7px; border-radius: 999px; background: rgba(255, 253, 248, .88); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.goal svg { width: 16px; height: 16px; }
.goal.done { background: var(--moss); color: #fff; }

.tip {
  position: absolute; left: 16px; bottom: calc(max(14px, env(safe-area-inset-bottom, 0px)) + 150px);
  width: min(400px, calc(100% - 32px));
  display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center;
  padding: 10px 14px; border-radius: 18px; background: var(--panel); border: 0;
  box-shadow: 0 8px 22px rgba(40, 70, 80, .14); text-align: left; font-size: 14px;
}
.tip svg { width: 40px; height: 30px; }
.toast {
  position: absolute; left: 50%; top: calc(max(12px, env(safe-area-inset-top, 0px)) + 104px); transform: translateX(-50%);
  max-width: calc(100% - 32px); padding: 8px 16px; border-radius: 999px;
  background: var(--ink); color: var(--panel); font-size: 14px; text-align: center; box-shadow: 0 8px 20px rgba(40, 70, 80, .25);
  animation: pop .25s ease-out;
}
@keyframes pop { from { opacity: 0; transform: translate(-50%, -6px); } to { opacity: 1; transform: translate(-50%, 0); } }

.tools {
  position: absolute; left: 16px; bottom: max(14px, env(safe-area-inset-bottom, 0px));
  display: grid; grid-template-columns: repeat(3, auto); gap: 10px; align-items: end;
}
.tools .label { display: block; font-size: 11px; color: var(--ink-soft); text-align: center; margin-top: 3px; }
.dpad {
  position: absolute; right: 16px; bottom: max(14px, env(safe-area-inset-bottom, 0px));
  width: 132px; height: 132px;
  display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px;
}
.dpad button {
  border: 0; border-radius: 18px; background: var(--panel); display: grid; place-items: center;
  box-shadow: 0 3px 0 var(--panel-line), 0 8px 18px rgba(40, 70, 80, .12);
}
.dpad button svg { width: 26px; height: 26px; stroke: var(--ink); fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.dpad button:active { background: #fff3e2; }
.dpad button.coach { background: var(--yuzu); animation: beat 1s ease-in-out infinite; }
.dpad button.coach svg { stroke: #fff; }
@keyframes beat { 50% { transform: scale(1.1); } }

.overlay {
  position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr); place-items: end center; overflow: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px));
}
.overlay.center { place-items: center; background: rgba(201, 233, 242, .55); }
.card {
  width: min(460px, 100%); min-width: 0; background: var(--panel); border-radius: 26px; padding: 22px 22px 20px;
  box-shadow: 0 6px 0 var(--panel-line), 0 20px 50px rgba(40, 70, 80, .18);
}
.title-card { text-align: center; }
.title-card h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(32px, 9vw, 44px); line-height: 1.1; text-wrap: balance; }
.title-card h1 em { font-style: normal; color: var(--yuzu-deep); }
.title-card p { margin: 8px auto 18px; color: var(--ink-soft); max-width: 30em; text-wrap: balance; }
.btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.primary { border: 0; border-radius: 18px; padding: 12px 22px; min-width: 140px; background: var(--yuzu); color: #fff; font-family: var(--f-display); font-size: 19px; box-shadow: 0 4px 0 var(--yuzu-deep); }
.primary:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--yuzu-deep); }
.secondary { border: 2px solid var(--panel-line); border-radius: 18px; padding: 10px 20px; min-width: 120px; background: var(--panel); font-family: var(--f-display); font-size: 18px; }
.progress-note { margin-top: 14px; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.select-card { width: min(560px, 100%); }
.select-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.select-head h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 26px; }
.chapters { position: relative; display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 10px; margin: 0 -4px 6px; }
.chapters button {
  flex: none; display: grid; grid-template-columns: auto auto; column-gap: 6px; align-items: baseline; text-align: left;
  border: 2px solid var(--panel-line); border-radius: 14px; background: #fff; padding: 6px 12px 5px;
}
.chapters button b { font-family: var(--f-display); font-weight: 400; font-size: 18px; color: var(--moss); grid-row: span 2; }
.chapters button span { font-size: 13px; white-space: nowrap; }
.chapters button small { font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.chapters button[aria-selected="true"] { border-color: var(--yuzu); background: #fff7ea; }
.chapters button:disabled { cursor: not-allowed; opacity: .5; }
.village-gim { margin: -2px 0 10px; font-size: 13px; color: var(--ink-soft); }
.stages { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.stage { border: 2px solid var(--panel-line); border-radius: 18px; background: #fff; padding: 10px 6px 9px; text-align: center; display: grid; gap: 2px; justify-items: center; }
.stage .num { font-family: var(--f-display); font-size: 26px; line-height: 1; color: var(--moss); }
.stage .nm { font-size: 12px; line-height: 1.3; min-height: 1.3em; }
.stage.cleared { border-color: var(--moss); }
.stage.next { border-color: var(--yuzu); box-shadow: 0 0 0 3px rgba(255, 162, 54, .25); }
.stage:disabled { cursor: not-allowed; background: #f6f4ef; }
.stage:disabled .num, .stage:disabled .nm { color: var(--locked); }
.flowers { display: flex; gap: 2px; height: 16px; align-items: center; }
.flowers svg { width: 15px; height: 15px; }
.f-on { fill: var(--blush); } .f-off { fill: var(--locked); }
.yz { fill: var(--yuzu); } .yz-leaf { fill: var(--moss); }
.intro-card { text-align: center; width: min(380px, 100%); }
.intro-tag { display: inline-block; padding: 2px 12px; border-radius: 999px; background: var(--yuzu); color: #fff; font-family: var(--f-display); font-size: 14px; }
.gim-art { display: block; width: 112px; height: 112px; margin: 12px auto 6px; }
.intro-card h2 { margin: 0 0 6px; font-family: var(--f-display); font-weight: 400; font-size: 26px; }
.intro-card p { margin: 0 auto 18px; color: var(--ink-soft); max-width: 26em; text-wrap: pretty; }
.dex-list { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); max-height: min(62vh, 560px); overflow: auto; padding: 2px; }
.dex-item { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; align-items: center; text-align: left; background: #fff; border: 2px solid var(--panel-line); border-radius: 16px; padding: 8px 10px; }
.dex-item svg { width: 52px; height: 52px; }
.dex-item b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 16px; }
.dex-item small { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 12px; color: var(--ink-soft); line-height: 1.4; }
.dex-item.locked { cursor: default; background: #f6f4ef; }
#clear { background: linear-gradient(180deg, transparent 40%, rgba(253, 235, 211, .6)); }
.clear-card { text-align: center; animation: rise .45s cubic-bezier(.2, .9, .3, 1.2); }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.clear-card h2 { margin: 0 0 4px; font-family: var(--f-display); font-weight: 400; font-size: 28px; text-wrap: balance; }
.big-flowers { display: flex; justify-content: center; gap: 8px; margin: 10px 0 6px; }
.big-flowers svg { width: 44px; height: 44px; }
.big-flowers svg.f-on-anim { animation: bloom .5s ease-out both; }
@keyframes bloom { from { transform: scale(.2) rotate(-40deg); } to { transform: none; } }
.stats { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 6px 0 16px; }
.stats span { padding: 4px 12px; border-radius: 999px; background: #f3efe6; font-size: 14px; font-variant-numeric: tabular-nums; }
.clear-next { margin: -6px 0 14px; font-size: 14px; color: var(--yuzu-deep); text-wrap: balance; }

@media (max-width: 480px) {
  .hud { padding-inline: 12px; gap: 6px; }
  .hud-right { flex-direction: column; gap: 6px; }
  .round { width: 42px; height: 42px; }
  .stage-name b { font-size: 18px; }
  .goal { font-size: 12px; padding: 1px 8px 1px 6px; }
  .tools { left: 12px; gap: 6px; }
  .dpad { right: 12px; width: 120px; height: 120px; }
  .tip { left: 12px; width: calc(100% - 24px); bottom: calc(max(14px, env(safe-area-inset-bottom, 0px)) + 140px); }
  .card { padding: 18px 16px 16px; border-radius: 22px; }
  .stages { gap: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="flower" viewBox="0 0 20 20">
    <circle cx="10" cy="4.6" r="3.9"/><circle cx="15.1" cy="8.3" r="3.9"/><circle cx="13.2" cy="14.3" r="3.9"/>
    <circle cx="6.8" cy="14.3" r="3.9"/><circle cx="4.9" cy="8.3" r="3.9"/><circle cx="10" cy="10" r="3" fill="#fff6d8"/>
  </symbol>
  <symbol id="yuzu" viewBox="0 0 20 20">
    <circle cx="10" cy="11.5" r="7.5" class="yz"/><ellipse cx="13" cy="4" rx="3.6" ry="1.8" transform="rotate(-28 13 4)" class="yz-leaf"/>
  </symbol>
  <symbol id="capy" viewBox="0 0 40 30">
    <rect x="11" y="11" width="27" height="16" rx="8" fill="#b07a4f"/><rect x="2" y="8" width="20" height="17" rx="7" fill="#b07a4f"/>
    <rect x="1" y="15" width="11" height="10" rx="4.5" fill="#7a5233"/><circle cx="12" cy="6" r="5" fill="#ffa236"/>
    <path d="M13 14 q2.4 -2 4.8 0" stroke="#284650" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </symbol>
  <symbol id="arrow" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
</svg>

<div id="app">
  <canvas id="scene" aria-label="연못 위 디딤돌 위에 귤 상자가 있어요. 밀거나 방향 버튼으로 굴려요."></canvas>

  <header class="hud" id="hud" hidden>
    <button type="button" class="round" id="toSelect" aria-label="스테이지 목록"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h14"/></svg></button>
    <div class="stage-name"><b id="stageTitle"></b><span id="moveLabel"></span><div class="goals" id="goals" aria-live="polite"></div></div>
    <div class="hud-right">
      <button type="button" class="round" id="helpBtn" aria-label="길잡이 도감"><svg viewBox="0 0 24 24"><path d="M9.2 9a3 3 0 1 1 4.3 2.7c-.9.5-1.5 1.2-1.5 2.3v.5"/><path d="M12 18h.01"/></svg></button>
      <button type="button" class="round" id="soundBtn" aria-label="소리 끄기"><svg viewBox="0 0 24 24" id="soundIcon"></svg></button>
    </div>
  </header>

  <button type="button" class="tip" id="tip" hidden><svg viewBox="0 0 40 30" aria-hidden="true"><use href="#capy"/></svg><span id="tipText"></span></button>
  <div class="toast" id="toast" role="status" hidden></div>

  <nav class="tools" id="tools" hidden aria-label="게임 도구">
    <div><button type="button" class="round" id="undoBtn" aria-label="한 번 되돌리기"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button><span class="label">되돌리기</span></div>
    <div><button type="button" class="round" id="hintBtn" aria-label="힌트"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z"/></svg></button><span class="label">힌트</span></div>
    <div><button type="button" class="round" id="resetBtn" aria-label="처음부터"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button><span class="label">처음부터</span></div>
  </nav>
  <div class="dpad" id="dpad" hidden role="group" aria-label="굴리기">
    <button type="button" data-d="W" aria-label="왼쪽 위로 굴리기"><svg viewBox="0 0 24 24" style="transform:rotate(-45deg)"><use href="#arrow"/></svg></button>
    <button type="button" data-d="N" aria-label="오른쪽 위로 굴리기"><svg viewBox="0 0 24 24" style="transform:rotate(45deg)"><use href="#arrow"/></svg></button>
    <button type="button" data-d="S" aria-label="왼쪽 아래로 굴리기"><svg viewBox="0 0 24 24" style="transform:rotate(-135deg)"><use href="#arrow"/></svg></button>
    <button type="button" data-d="E" aria-label="오른쪽 아래로 굴리기"><svg viewBox="0 0 24 24" style="transform:rotate(135deg)"><use href="#arrow"/></svg></button>
  </div>

  <section class="overlay" id="title">
    <div class="card title-card">
      <h1>데굴데굴 <em>귤 상자</em></h1>
      <p>길쭉한 귤 상자를 굴려 온천 구멍 위에 똑바로 세워 주세요. 상자가 쏙 들어가면 카피바라가 기뻐해요.</p>
      <div class="btn-row">
        <button type="button" class="primary" id="playBtn">시작하기</button>
        <button type="button" class="secondary" id="stagesBtn">스테이지</button>
      </div>
      <div class="progress-note" id="progressNote"></div>
    </div>
  </section>

  <section class="overlay center" id="select" hidden>
    <div class="card select-card" role="dialog" aria-labelledby="selectTitle">
      <div class="select-head">
        <h2 id="selectTitle">정원 고르기</h2>
        <button type="button" class="round" id="closeSelect" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="chapters" id="chapters" role="tablist" aria-label="정원"></div>
      <p class="village-gim" id="villageGim"></p>
      <div class="stages" id="stages"></div>
      <div class="progress-note" id="selectNote"></div>
    </div>
  </section>

  <section class="overlay center" id="intro" hidden>
    <div class="card intro-card" role="dialog" aria-labelledby="introTitle">
      <span class="intro-tag" id="introTag"></span>
      <svg class="gim-art" id="introArt" viewBox="0 0 64 64" aria-hidden="true"></svg>
      <h2 id="introTitle"></h2>
      <p id="introText"></p>
      <button type="button" class="primary" id="introGo">해볼게요</button>
    </div>
  </section>

  <section class="overlay center" id="dex" hidden>
    <div class="card select-card" role="dialog" aria-labelledby="dexTitle">
      <div class="select-head">
        <h2 id="dexTitle">길잡이 도감</h2>
        <button type="button" class="round" id="closeDex" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="dex-list" id="dexList"></div>
    </div>
  </section>

  <section class="overlay" id="clear" hidden>
    <div class="card clear-card" role="dialog" aria-labelledby="clearTitle">
      <h2 id="clearTitle"></h2>
      <div class="big-flowers" id="bigFlowers"></div>
      <div class="stats" id="clearStats"></div>
      <p class="clear-next" id="clearNext" hidden></p>
      <div class="btn-row">
        <button type="button" class="secondary" id="againBtn">다시 하기</button>
        <button type="button" class="primary" id="nextBtn">다음 정원길</button>
      </div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(() => {
'use strict';
// LOGIC START
// Board chars: . void   o stone   S start (block stands here)   G onsen hole   y stone with a yuzu
// l lily pad (can't stand upright on it)   b button (any touch)   B flower button (upright only)
// = bridge, closed at start   + bridge, open at start   i ice (a block resting fully on ice slides on)
const DIRV = { N: [0, -1], E: [1, 0], S: [0, 1], W: [-1, 0] };
const DIR_KEYS = ['N', 'E', 'S', 'W'];

function parseBoard(L) {
  const H = L.board.length, W = L.board[0].length;
  const cells = [];
  let start = null, goal = null;
  for (let z = 0; z < H; z++) {
    if (L.board[z].length !== W) throw new Error(`${L.name}: row ${z} width mismatch`);
    for (let x = 0; x < W; x++) {
      const ch = L.board[z][x];
      if (!'.oSGylbB=+i'.includes(ch)) throw new Error(`${L.name}: unknown tile ${ch}`);
      cells.push(ch);
      if (ch === 'S') start = [x, z];
      if (ch === 'G') goal = [x, z];
    }
  }
  if (!start || !goal) throw new Error(`${L.name}: needs S and G`);
  const at = (x, z) => (x >= 0 && z >= 0 && x < W && z < H ? cells[z * W + x] : '.');
  const yuzu = [];
  cells.forEach((c, n) => { if (c === 'y') yuzu.push([n % W, Math.floor(n / W)]); });
  const bridgesOpenAtStart = cells.includes('+');
  return { name: L.name, W, H, cells, at, start, goal, yuzu, hasBridges: cells.some(c => c === '=' || c === '+'), bridgesOpenAtStart };
}

// o: 'u' upright, 'x' lying along x (covers x, x+1), 'z' lying along z (covers z, z+1)
const occupied = s => s.o === 'u' ? [[s.x, s.z]] : s.o === 'x' ? [[s.x, s.z], [s.x + 1, s.z]] : [[s.x, s.z], [s.x, s.z + 1]];
function rolled(s, d) {
  const { x, z, o } = s;
  if (o === 'u') return { E: { x: x + 1, z, o: 'x' }, W: { x: x - 2, z, o: 'x' }, S: { x, z: z + 1, o: 'z' }, N: { x, z: z - 2, o: 'z' } }[d];

function tryMove(d) {

  if (anim) { queued = d; return; }
  const r = step(b, game, d);
  if (r.blocked) {
    anim = { kind: 'bump', d, t: 0, dur: 0.22 };
    Sound.bump();

    if (r.blocked === 'bridge') toast('다리가 걷혀 있어요. 버튼을 밟아 보세요');
    return;
  }
  history.push({ game, moves, q: crateQ.clone() });
  moves++;
  const from = game;
  game = r.g;

  const segs = r.path.map((p, n) => ({ kind: p.kind, s: p.s, prev: n === 0 ? from.s : r.path[n - 1].s }));
  anim = { kind: 'path', segs, n: 0, t: 0, d, r };
  coachDir = null; hintUntil = 0;
  updateHUD();
}

// ---------- camera ----------
function fitCamera() {
  const w = window.innerWidth, h = window.innerHeight, aspect = w / h;
  renderer.setSize(w, h, false);
  const W = b ? b.W : 8, H = b ? b.H : 6;
  // projected width of the board in this fixed iso view is (W + H) / sqrt(2)
  const spanW = (W + H) * 0.72 + 1.2, spanH = (W + H) * 0.42 + 4.2;
  const fh = Math.max(spanH, spanW / aspect);
  camera.left = -fh * aspect / 2; camera.right = fh * aspect / 2; camera.top = fh / 2; camera.bottom = -fh / 2;
  camera.updateProjectionMatrix();
  // nudge the board down a little on tall screens so the HUD does not cover it
  camera.position.set(10, 8.6, 10);
  camera.lookAt(0, aspect < 0.8 ? -0.4 : 0.2, 0);
}
window.addEventListener('resize', fitCamera);

  $('#introTitle').textContent = g.name;
  $('#introText').textContent = g.text;
  $('#introGo').textContent = beforePlay ? '해볼게요' : '닫기';
  $('#introGo').onclick = () => { if (beforePlay) { save.seen[key] = true; writeSave(); showScreen('play'); updateCoach(); } else openDex(); };
  showScreen('intro');
  $('#introGo').focus();
}
let dexFrom = 'play';
function openDex() {
  if (mode !== 'dex' && mode !== 'intro') dexFrom = mode;
  const reach = Math.max(firstUnfinished(), mode === 'play' ? levelIndex : 0);
  const open = new Set(LEVELS.slice(0, reach + 1).map(L => L.intro).filter(Boolean).concat(Object.keys(save.seen)));
  $('#dexList').replaceChildren(...GIMMICK_ORDER.map(k => {
    const g = GIMMICKS[k], el = document.createElement('button');
    el.type = 'button'; el.className = 'dex-item' + (open.has(k) ? '' : ' locked'); el.disabled = !open.has(k);
    el.innerHTML = `<svg viewBox="0 0 64 64" aria-hidden="true">${open.has(k) ? g.art : '<circle cx="32" cy="32" r="22" fill="#e8e2d6"/>'}</svg><span><b></b><small></small></span>`;
    el.querySelector('b').textContent = open.has(k) ? g.name : '아직 못 만났어요';
    el.querySelector('small').textContent = open.has(k) ? g.text : '정원을 지나가면 만날 수 있어요';
    if (open.has(k)) el.addEventListener('click', () => showIntro(k, false));
    return el;
  }));
  showScreen('dex');
}
$('#helpBtn').addEventListener('click', openDex);
$('#closeDex').addEventListener('click', () => { if (dexFrom === 'play') { showScreen('play'); updateCoach(); } else if (dexFrom === 'select') openSelect(); else showTitle(); });

let selectFrom = 'title', selectChapter = 0;
function openSelect() {
  if (mode !== 'select' && mode !== 'dex') selectFrom = mode;
  selectChapter = chapterOf(mode === 'play' || mode === 'clear' ? levelIndex : firstUnfinished());
  renderSelect(); showScreen('select');
}
function renderSelect() {
  const next = firstUnfinished();
  $('#chapters').replaceChildren(...GARDENS.map((g, k) => {
    const el = document.createElement('button');
    el.type = 'button'; el.role = 'tab'; el.setAttribute('aria-selected', String(k === selectChapter));
    el.disabled = !isOpen(k * PER_GARDEN);
    const done = [...Array(PER_GARDEN).keys()].filter(j => isCleared(k * PER_GARDEN + j)).length;
    el.innerHTML = `<b>${k + 1}</b><span></span><small>${el.disabled ? '잠김' : `${done}/${PER_GARDEN}`}</small>`;
    el.querySelector('span').textContent = g.name;
    el.addEventListener('click', () => { selectChapter = k; renderSelect(); });
    return el;
  }));
  const strip = $('#chapters'), sel = strip.children[selectChapter];
  if (sel) strip.scrollLeft = sel.offsetLeft - (strip.clientWidth - sel.offsetWidth) / 2;
  $('#villageGim').textContent = `이 정원에서 만나는 길 · ${GIMMICKS[GARDENS[selectChapter].gim].name}`;
  $('#stages').replaceChildren(...LEVELS.slice(selectChapter * PER_GARDEN, (selectChapter + 1) * PER_GARDEN).map((L, j) => {
    const i = selectChapter * PER_GARDEN + j, rec = save.levels[i], el = document.createElement('button');
    el.type = 'button';
    el.className = 'stage' + (rec ? ' cleared' : '') + (i === next && !rec ? ' next' : '');
    el.disabled = !isOpen(i);
    el.innerHTML = `<span class="num">${i + 1}</span><span class="nm"></span><span class="flowers">${el.disabled ? '' : flowerIcons(rec ? rec.flowers : 0)}</span>`;
    el.querySelector('.nm').textContent = el.disabled ? '잠김' : L.coach ? '배워 보기' : `${j + 1}번 길`;
    el.setAttribute('aria-label', `${i + 1}. ${L.name}${el.disabled ? ' (잠김)' : rec ? `, 꽃 ${rec.flowers}송이` : ''}`);
    el.addEventListener('click', () => startLevel(i));
    return el;
  }));
  $('#selectNote').textContent = progressText();
}
$('#playBtn').addEventListener('click', () => { Sound.ensure(); startLevel(firstUnfinished()); });
$('#stagesBtn').addEventListener('click', () => { Sound.ensure(); openSelect(); });
$('#toSelect').addEventListener('click', openSelect);
$('#closeSelect').addEventListener('click', () => { if (selectFrom === 'play') showScreen('play'); else showTitle(); });

function showClear() {
  const L = LEVELS[levelIndex], fl = flowersFor(moves, L.par), prev = save.levels[levelIndex];
  save.levels[levelIndex] = { moves: prev ? Math.min(prev.moves, moves) : moves, flowers: Math.max(prev ? prev.flowers : 0, fl) };
  writeSave();
  const last = levelIndex === LEVELS.length - 1, gardenEnd = levelIndex % PER_GARDEN === PER_GARDEN - 1;
  $('#clearTitle').textContent = last ? '모든 정원을 산책했어요' : gardenEnd ? `${GARDENS[chapterOf(levelIndex)].name} 완성!` : '귤 상자가 온천에 쏙!';
  $('#bigFlowers').innerHTML = flowerIcons(fl, 3, 'f-on-anim');
  const stats = [`굴린 횟수 ${moves} · 목표 ${L.par}`];
  if (prev && moves < prev.moves) stats.push('최고 기록');
  if (fl < 3) stats.push(`${L.par}번 만에 가는 길이 있어요`);
  $('#clearStats').replaceChildren(...stats.map(t => Object.assign(document.createElement('span'), { textContent: t })));
  const nextG = !last && gardenEnd ? GARDENS[chapterOf(levelIndex) + 1] : null;
  $('#clearNext').textContent = nextG ? `다음 정원 ${nextG.name}에서 새 길 '${GIMMICKS[nextG.gim].name}'을 만나요` : '';
  $('#clearNext').hidden = !nextG;
  $('#nextBtn').textContent = last ? '스테이지 목록' : gardenEnd ? '다음 정원으로' : '다음 정원길';
  Sound.chime();
  hideTip();
  showScreen('clear');
}
$('#againBtn').addEventListener('click', () => startLevel(levelIndex, true));
$('#nextBtn').addEventListener('click', () => { if (levelIndex === LEVELS.length - 1) openSelect(); else startLevel(levelIndex + 1); });

function showTitle() {
  tipOpen = false;
  buildLevel(0);
  $('#playBtn').textContent = totals().done ? '이어하기' : '시작하기';
  $('#progressNote').textContent = progressText();
  showScreen('title');
}

// ---------- animation ----------
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function spawnSteam(pos) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: steamTex, transparent: true, depthWrite: false, opacity: 0 }));
  sp.position.copy(pos).add(new THREE.Vector3((Math.random() - 0.5) * 0.3, 0, (Math.random() - 0.5) * 0.3));
  sp.scale.setScalar(0.18); world.add(sp);
  particles.push({ sprite: sp, age: 0, life: 2.2 + Math.random() * 0.8, vx: (Math.random() - 0.5) * 0.08 });
}
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const clock = new THREE.Clock();
let titleT = 0;
function tick() {
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  if (mode === 'title' && !reduced) { titleT += dt; if (!anim && titleT > 1.1 && b) { titleT = 0; const sol = solve(b, game); if (sol && sol.length) { mode = 'play'; tryMove(sol[0]); mode = 'title'; } else { game = startState(b); crateQ.identity(); placeCrate(game.s, crateQ); } } }

  if (anim && anim.kind === 'path') {
    const seg = anim.segs[anim.n];
    const dur = seg.kind === 'roll' ? (reduced ? 0.08 : 0.2) : 0.12;
    anim.t += dt;
    const k = Math.min(1, anim.t / dur);
    if (seg.kind === 'roll') {
      const pivot = rollPivot(seg.prev, anim.d);
      const axis = new THREE.Vector3(...DIR_AXIS[anim.d]);
      const q = new THREE.Quaternion().setFromAxisAngle(axis, ease(k) * Math.PI / 2);
      const from = crateCenter(seg.prev);
      crate.position.copy(from.clone().sub(pivot).applyQuaternion(q).add(pivot));
      crate.quaternion.copy(q.clone().multiply(crateQ));
      if (k >= 1) { crateQ.premultiply(new THREE.Quaternion().setFromAxisAngle(axis, Math.PI / 2)); }
    } else {
      crate.position.copy(crateCenter(seg.prev).lerp(crateCenter(seg.s), k));
      if (anim.n === 1 && anim.t < dt * 1.5) Sound.slide();
    }
    if (k >= 1) {
      anim.n++; anim.t = 0;
      if (anim.n >= anim.segs.length) {
        const r = anim.r; anim = null;
        // snap to an exact 90-degree orientation
        const e = new THREE.Euler().setFromQuaternion(crateQ);
        e.set(Math.round(e.x / (Math.PI / 2)) * Math.PI / 2, Math.round(e.y / (Math.PI / 2)) * Math.PI / 2, Math.round(e.z / (Math.PI / 2)) * Math.PI / 2);
        crateQ.setFromEuler(e);
        placeCrate(game.s, crateQ);
        finishMove(r);
        if (queued && !won) { const d = queued; queued = null; tryMove(d); }
      }
    }
  } else if (anim && anim.kind === 'bump') {
    anim.t += dt;
    const k = Math.min(1, anim.t / anim.dur), [dx, dz] = DIRV[anim.d];
    const c = crateCenter(game.s), off = Math.sin(k * Math.PI) * 0.08;
    crate.position.set(c.x + dx * off, c.y, c.z + dz * off);
    if (k >= 1) { anim = null; placeCrate(game.s, crateQ); if (queued) { const d = queued; queued = null; tryMove(d); } }
  } else if (anim && anim.kind === 'win') {
    anim.t += dt;
    const k = Math.min(1, anim.t / 0.9);
    const c = crateCenter(game.s);
    crate.position.set(c.x, c.y - ease(k) * 1.6, c.z);
    if (k > 0.3 && !anim.burst) { anim.burst = true; for (let n = 0; n < 14; n++) spawnSteam(c.clone().setY(0.2)); }
  }

  for (const y of yuzuObjs) {
    if (y.got && y.t < 1) { y.t += dt * 2; y.obj.position.y = y.t * 1.2; y.obj.scale.setScalar(Math.max(0.01, 1 - y.t)); if (y.t >= 1) y.obj.visible = false; }
    else if (!y.got) { y.obj.rotation.y += dt; y.obj.position.y = Math.sin(t * 2 + y.obj.position.x) * 0.04; }
  }
  if (lid) { const want = lid.userData.open ? 0.9 : 0.05; lid.position.y += (want - lid.position.y) * Math.min(1, dt * 5); lid.visible = lid.position.y < 0.85; }
  for (const br of bridges) {
    const want = br.open ? 0 : -0.27;
    br.obj.position.y += (want - br.obj.position.y) * Math.min(1, dt * 7);
    br.obj.rotation.z = br.open ? 0 : Math.sin(t * 1.3 + br.p.x) * 0.04;
  }
  for (const tl of tiles.values()) if (tl.userData.btn) { if (tl.userData.press > 0) { tl.userData.press -= dt; tl.userData.btn.position.y = 0.0; } else tl.userData.btn.position.y = 0.04; }
  if (capy) {
    const happy = won && anim && anim.t > 0.6;
    for (const e of capy.userData.eyes) e.scale.y = 0.036 * (happy ? 0.2 : 1);
    capy.position.y = capy.userData.base + (happy && !reduced ? Math.abs(Math.sin(t * 7)) * 0.18 : Math.sin(t * 1.5) * 0.006);
  }
  if (hole) hole.position.y = 0.01 + Math.sin(t * 3) * 0.006;
  // coach arrow on the board
  if (coachDir && mode === 'play' && !anim) {
    arrowHelper.visible = true;
    const c = crateCenter(game.s);
    const [dx, dz] = DIRV[coachDir];
    const reach = game.s.o === 'u' ? 0.9 : (game.s.o === 'x' ? (dx ? 1.4 : 0.9) : (dz ? 1.4 : 0.9));
    arrowHelper.position.set(c.x + dx * reach, 0.08 + Math.sin(t * 6) * 0.03, c.z + dz * reach);
    arrowHelper.rotation.y = Math.atan2(-dx, -dz);
  } else arrowHelper.visible = false;

  for (const em of emitters) { if (!em.on()) continue; em.acc += dt * em.rate; while (em.acc > 1) { em.acc -= 1; spawnSteam(em.pos); } }
  for (const p of particles) { p.age += dt; const k = p.age / p.life; p.sprite.position.y += dt * 0.35; p.sprite.position.x += p.vx * dt; p.sprite.scale.setScalar(0.16 + k * 0.4); p.sprite.material.opacity = Math.sin(Math.min(1, k) * Math.PI) * 0.55; }
  particles = particles.filter(p => { if (p.age < p.life) return true; world.remove(p.sprite); p.sprite.material.dispose(); return false; });
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

// ---------- boot ----------
renderSound();
window.claude?.hot?.snapshot?.(() => ({ mode, levelIndex }));
function boot(data) {
  if (data && data.mode === 'play' && Number.isInteger(data.levelIndex)) startLevel(data.levelIndex, true);
  else showTitle();
  requestAnimationFrame(tick);
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
